<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Mining Simulator Ultimate</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none; 
        }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 14px 22px;
            border-radius: 10px;
            font-weight: bold;
            pointer-events: none;
            line-height: 1.6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-size: 14px;
        }
        #ui-hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            line-height: 1.5;
        }
        #shop-ui {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 280px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            font-size: 14px;
        }
        #shop-ui h3 {
            margin-top: 0;
            text-align: center;
            color: #ffd700;
            border-bottom: 2px solid #444;
            padding-bottom: 8px;
        }
        .pickaxe-card {
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .pickaxe-card.owned {
            border: 2px solid #00ffaa;
        }
        .pickaxe-card button {
            background: #28a745;
            color: white;
            border: none;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .pickaxe-card button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        #notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: #ffd700;
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="instructions">
        WASD: Fast Move | SHIFT: Sprint | SPACE: Jump<br>
        LEFT / RIGHT-CLICK & Drag OR ARROWS: Rotate Camera<br>
        <strong>Tap 'E'</strong> near a shaking rock to Swing Pickaxe & Mine!
    </div>

    <div id="ui-hud">
        Gems: <span id="gem-count" style="color: #00ffcc;">0</span> 💎<br>
        Pickaxe: <span id="current-pickaxe" style="color: #ffd700;">Rusty Pickaxe</span> (Dmg: <span id="current-damage">1</span>)
    </div>

    <div id="shop-ui">
        <h3>⛏️ Pickaxe Shop</h3>
        <div id="shop-list"></div>
    </div>

    <div id="notification"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let gemCount = 0;
        let currentPickaxeIndex = 0;

        const pickaxes = [
            { name: "Rusty Pickaxe", damage: 1, cost: 0, color: 0x8b5a2b },
            { name: "Stone Pickaxe", damage: 3, cost: 25, color: 0x888888 },
            { name: "Iron Pickaxe", damage: 8, cost: 100, color: 0xcccccc },
            { name: "Gold Pickaxe", damage: 20, cost: 400, color: 0xffd700 },
            { name: "Cosmic Pickaxe", damage: 50, cost: 1500, color: 0x9400d3 }
        ];

        const rockTiers = [
            { 
                name: "Common", hp: 3, color: 0x555555, ringColor: 0xffffff, gemValue: 1,
                types: ["Cobblestone", "Basalt", "Pebble Rock", "Granite", "Sandstone"]
            },
            { 
                name: "Uncommon", hp: 12, color: 0x2e8b57, ringColor: 0x00ff00, gemValue: 5,
                types: ["Mossy Boulder", "Limestone", "Diorite", "Slate", "Serpentine"]
            },
            { 
                name: "Rare", hp: 40, color: 0x1e90ff, ringColor: 0x00bfff, gemValue: 20,
                types: ["Sapphire Rock", "Lapis Ore", "Azurite", "Cobalt Stone", "Sodalite"]
            },
            { 
                name: "Epic", hp: 120, color: 0x9932cc, ringColor: 0xda70d6, gemValue: 80,
                types: ["Amethyst Cluster", "Ruby Rock", "Garnet Stone", "Topaz Node", "Morganite"]
            },
            { 
                name: "Cosmic", hp: 350, color: 0xff4500, ringColor: 0xffd700, gemValue: 300,
                types: ["Obsidian Core", "Meteorite", "Nether Rock", "Void Crystal", "Cosmic Monolith"]
            }
        ];

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 0.85);
        dirLight.position.set(30, 50, 20);
        scene.add(dirLight);

        const groundSize = 140;
        const groundGeometry = new THREE.PlaneGeometry(groundSize, groundSize);
        groundGeometry.rotateX(-Math.PI / 2);
        const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x1e4112 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        scene.add(ground);

        // Grass field setup
        const grassGeometry = new THREE.ConeGeometry(0.08, 0.7, 3);
        grassGeometry.translate(0, 0.35, 0); 
        const grassMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                attribute float phase;
                uniform float time;
                uniform vec3 playerPos;
                varying float vHeight;
                void main() {
                    vHeight = position.y / 0.7;
                    vec3 worldPos = (instanceMatrix * vec4(position, 1.0)).xyz;
                    vec3 pos = position;
                    float wave = sin(time * 2.5 + phase) * 0.07 * pow(vHeight, 2.0);
                    pos.x += wave;
                    float dist = distance(worldPos.xz, playerPos.xz);
                    if (dist < 1.4) {
                        float pushFactor = (1.0 - (dist / 1.4)) * pow(vHeight, 1.2);
                        vec2 pushDir = normalize(worldPos.xz - playerPos.xz + vec2(0.001));
                        pos.x += pushDir.x * pushFactor * 0.7;
                        pos.z += pushDir.y * pushFactor * 0.7;
                        pos.y -= pushFactor * 0.35;
                    }
                    gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(pos, 1.0);
                }
            `,
            fragmentShader: `
                varying float vHeight;
                void main() {
                    gl_FragColor = vec4(mix(vec3(0.08, 0.35, 0.05), vec3(0.48, 0.82, 0.16), vHeight), 1.0);
                }
            `,
            uniforms: { time: { value: 0 }, playerPos: { value: new THREE.Vector3() } }
        });

        const grassCount = 18000;
        const grassField = new THREE.InstancedMesh(grassGeometry, grassMaterial, grassCount);
        const dummy = new THREE.Object3D();
        const phases = new Float32Array(grassCount);
        for (let i = 0; i < grassCount; i++) {
            dummy.position.set((Math.random() - 0.5) * 130, 0, (Math.random() - 0.5) * 130);
            dummy.rotation.y = Math.random() * Math.PI * 2;
            const scale = 0.75 + Math.random() * 0.55;
            dummy.scale.set(scale, scale, scale);
            dummy.updateMatrix();
            grassField.setMatrixAt(i, dummy.matrix);
            phases[i] = Math.random() * Math.PI * 2;
        }
        grassGeometry.setAttribute('phase', new THREE.InstancedBufferAttribute(phases, 1));
        scene.add(grassField);

        // Rocks creation
        const detailedRockGeo = new THREE.IcosahedronGeometry(1, 1);
        const rockCount = 55;
        const rocksList = [];
        const ringGeo = new THREE.RingGeometry(1.0, 1.25, 32);
        ringGeo.rotateX(-Math.PI / 2);

        for (let i = 0; i < rockCount; i++) {
            let rx = (Math.random() - 0.5) * 120;
            let rz = (Math.random() - 0.5) * 120;
            if (Math.hypot(rx, rz) < 6) { rx += 10; rz += 10; }

            let randTierRoll = Math.random();
            let tierIndex = randTierRoll > 0.60 ? (randTierRoll > 0.85 ? (randTierRoll > 0.96 ? (randTierRoll > 0.99 ? 4 : 3) : 2) : 1) : 0;
            const tier = rockTiers[tierIndex];
            const typeName = tier.types[Math.floor(Math.random() * tier.types.length)];

            const sx = 0.8 + Math.random() * 0.8;
            const sy = 0.7 + Math.random() * 0.7;
            const sz = 0.8 + Math.random() * 0.8;

            const rockMat = new THREE.MeshStandardMaterial({ color: tier.color, roughness: 0.8, metalness: 0.2, flatShading: true });
            const rockMesh = new THREE.Mesh(detailedRockGeo, rockMat);
            rockMesh.position.set(rx, sy * 0.5, rz);
            const bRotZ = Math.random() * 0.3;
            rockMesh.rotation.set(Math.random() * 0.3, Math.random() * Math.PI, bRotZ);
            rockMesh.scale.set(sx, sy, sz);
            scene.add(rockMesh);

            const ringMesh = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: tier.ringColor, side: THREE.DoubleSide }));
            ringMesh.position.set(rx, 0.05, rz);
            const ringRadius = Math.max(sx, sz) * 1.35;
            ringMesh.scale.set(ringRadius, ringRadius, ringRadius);
            ringMesh.visible = false;
            scene.add(ringMesh);

            rocksList.push({
                mesh: rockMesh, ring: ringMesh, tier: tier, typeName: typeName,
                maxHp: tier.hp, hp: tier.hp, x: rx, z: rz, baseY: sy * 0.5,
                baseRotZ: bRotZ, baseScale: new THREE.Vector3(sx, sy, sz),
                radius: Math.max(sx, sz) * 0.85, state: 'intact', gem: null, shards: [], riseProgress: 0
            });
        }

        // Character setup
        const canvas = document.createElement('canvas');
        canvas.width = 128; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffcc99'; ctx.fillRect(0, 0, 128, 128);
        ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(40, 55, 7, 0, Math.PI * 2); ctx.arc(88, 55, 7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(37, 52, 2, 0, Math.PI * 2); ctx.arc(85, 52, 2, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = 4; ctx.strokeStyle = '#111'; ctx.beginPath(); ctx.arc(64, 70, 22, 0.1 * Math.PI, 0.9 * Math.PI, false); ctx.stroke();
        const faceTexture = new THREE.CanvasTexture(canvas);

        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        const skinMat = new THREE.MeshLambertMaterial({ color: 0xffcc99 });
        const faceMat = new THREE.MeshLambertMaterial({ map: faceTexture });
        const headGroup = new THREE.Group();
        headGroup.position.y = 2.4;
        headGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.8, 16), skinMat));
        const facePlane = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.7), faceMat);
        facePlane.position.set(0, 0, 0.46);
        headGroup.add(facePlane);

        const hairMat = new THREE.MeshLambertMaterial({ color: 0x5a2d0c });
        headGroup.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.15, 0.7), hairMat), { position: new THREE.Vector3(0, 0.42, 0) }));
        playerGroup.add(headGroup);

        playerGroup.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.6), new THREE.MeshLambertMaterial({ color: 0x0066cc })), { position: new THREE.Vector3(0, 1.3, 0) }));
        playerGroup.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.9, 0.4), new THREE.MeshLambertMaterial({ color: 0x8b4513 })), { position: new THREE.Vector3(0, 1.3, -0.45) }));

        const createLimb = (geo, mat, pos) => {
            geo.translate(0, -0.5, 0);
            const m = new THREE.Mesh(geo, mat);
            m.position.copy(pos);
            playerGroup.add(m);
            return m;
        };

        const leftArm = createLimb(new THREE.BoxGeometry(0.4, 1.2, 0.4), skinMat, new THREE.Vector3(-0.8, 1.9, 0));
        const rightArm = createLimb(new THREE.BoxGeometry(0.4, 1.2, 0.4), skinMat, new THREE.Vector3(0.8, 1.9, 0));
        
        // Pickaxe in right hand
        const pickaxeGroup = new THREE.Group();
        const pickHead = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.3, 0.3), new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8 }));
        const pickHandle = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.2), new THREE.MeshLambertMaterial({ color: 0x5a2d0c }));
        pickHandle.position.y = -0.5;
        pickaxeGroup.add(pickHead, pickHandle);
        pickaxeGroup.position.set(0, -1.0, 0);
        pickaxeGroup.rotation.x = Math.PI / 2;
        rightArm.add(pickaxeGroup);

        const leftLeg = createLimb(new THREE.BoxGeometry(0.5, 1.2, 0.5), new THREE.MeshLambertMaterial({ color: 0x222 }), new THREE.Vector3(-0.35, 0.6, 0));
        const rightLeg = createLimb(new THREE.BoxGeometry(0.5, 1.2, 0.5), new THREE.MeshLambertMaterial({ color: 0x222 }), new THREE.Vector3(0.35, 0.6, 0));

        let keys = { w: false, a: false, s: false, d: false, ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false, space: false, shift: false, e: false };
        window.addEventListener('keydown', e => {
            if (e.code === "Space") keys.space = true;
            if (e.key === "Shift" || e.code === "ShiftLeft") keys.shift = true;
            if (e.key.toLowerCase() === "e") keys.e = true;
            const k = e.key.toLowerCase(); if (keys.hasOwnProperty(k)) keys[k] = true;
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
        });
        window.addEventListener('keyup', e => {
            if (e.code === "Space") keys.space = false;
            if (e.key === "Shift" || e.code === "ShiftLeft") keys.shift = false;
            if (e.key.toLowerCase() === "e") keys.e = false;
            const k = e.key.toLowerCase(); if (keys.hasOwnProperty(k)) keys[k] = false;
        });

        let playerVelocityY = 0, isGrounded = true, camYaw = 0, camPitch = 0.3, camDistance = 8.0, isMouseDown = false, eKeyProcessed = false, miningAnimationTimer = 0;
        const flyingGems = [];

        window.addEventListener('mousedown', () => isMouseDown = true);
        window.addEventListener('mouseup', () => isMouseDown = false);
        window.addEventListener('mousemove', e => { if (isMouseDown) { camYaw -= e.movementX * 0.005; camPitch = Math.max(-0.2, Math.min(Math.PI / 2 - 0.1, camPitch + e.movementY * 0.005)); } });
        window.addEventListener('wheel', e => camDistance = Math.max(1, Math.min(35, camDistance + e.deltaY * 0.005)));

        function updateShopUI() {
            const listEl = document.getElementById('shop-list');
            listEl.innerHTML = '';
            pickaxes.forEach((p, index) => {
                const isOwned = index <= currentPickaxeIndex;
                const isNext = index === currentPickaxeIndex + 1;
                const card = document.createElement('div');
                card.className = `pickaxe-card ${isOwned ? 'owned' : ''}`;
                card.innerHTML = `<div><strong>${p.name}</strong></div><div style="font-size:12px; color:#aaa;">Damage: +${p.damage}</div>` +
                    (!isOwned ? `<div style="font-size:12px; color:#ffd700;">Cost: ${p.cost} Gems</div>` : '') +
                    (isOwned ? '<div style="color:#00ffaa; font-size:12px; font-weight:bold;">UNLOCKED</div>' : `<button ${!isNext || gemCount < p.cost ? 'disabled' : ''} onclick="buyPickaxe(${index})">Purchase</button>`);
                listEl.appendChild(card);
            });
            document.getElementById('gem-count').innerText = gemCount;
            document.getElementById('current-pickaxe').innerText = pickaxes[currentPickaxeIndex].name;
            document.getElementById('current-damage').innerText = pickaxes[currentPickaxeIndex].damage;
        }

        window.buyPickaxe = function(index) {
            if (gemCount >= pickaxes[index].cost && index === currentPickaxeIndex + 1) {
                gemCount -= pickaxes[index].cost;
                currentPickaxeIndex = index;
                updateShopUI();
                showNotification(`Purchased ${pickaxes[index].name}!`);
            }
        };

        function showNotification(text) {
            const notif = document.getElementById('notification');
            notif.innerText = text;
            notif.style.opacity = '1';
            setTimeout(() => { notif.style.opacity = '0'; }, 2000);
        }

        let currentRotation = 0, walkTimer = 0;

        function resolveRockCollision(nx, nz) {
            for (const r of rocksList) {
                if (r.state === 'shattered' || r.state === 'collected') continue;
                const dist = Math.hypot(nx - r.x, nz - r.z);
                const minDist = r.radius + 0.6;
                if (dist < minDist) {
                    const overlap = minDist - dist;
                    nx += (nx - r.x) / (dist || 1) * overlap;
                    nz += (nz - r.z) / (dist || 1) * overlap;
                }
            }
            return { x: nx, z: nz };
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();
            grassMaterial.uniforms.time.value = elapsedTime;
            grassMaterial.uniforms.playerPos.value.copy(playerGroup.position);

            if (keys.ArrowLeft) camYaw += 0.04;
            if (keys.ArrowRight) camYaw -= 0.04;

            if (keys.space && isGrounded) { playerVelocityY = 0.45; isGrounded = false; }
            playerGroup.position.y += playerVelocityY;
            if (!isGrounded) playerVelocityY -= 0.022;
            if (playerGroup.position.y <= 0) { playerGroup.position.y = 0; playerVelocityY = 0; isGrounded = true; }

            let inputX = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
            let inputZ = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);
            if (inputX !== 0 || inputZ !== 0) {
                const targetAngle = Math.atan2(inputX, inputZ) + camYaw;
                const spd = keys.shift ? 0.38 : 0.24;
                const res = resolveRockCollision(playerGroup.position.x + Math.sin(targetAngle) * spd, playerGroup.position.z + Math.cos(targetAngle) * spd);
                playerGroup.position.x = res.x; playerGroup.position.z = res.z;
                
                let diff = targetAngle - currentRotation;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                currentRotation += diff * 0.2;
                playerGroup.rotation.y = currentRotation;

                walkTimer += keys.shift ? 0.40 : 0.28;
                leftArm.rotation.x = Math.sin(walkTimer) * 0.7;
                if (miningAnimationTimer <= 0) rightArm.rotation.x = -Math.sin(walkTimer) * 0.7;
                leftLeg.rotation.x = -Math.sin(walkTimer) * 0.7;
                rightLeg.rotation.x = Math.sin(walkTimer) * 0.7;
            } else {
                leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, 0, 0.2);
                if (miningAnimationTimer <= 0) rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, 0, 0.2);
                leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, 0, 0.2);
                rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, 0, 0.2);
            }

            if (miningAnimationTimer > 0) {
                miningAnimationTimer -= 0.05;
                rightArm.rotation.x = -1.5 + Math.sin(miningAnimationTimer * 10) * 0.5;
            }

            let closestRock = null, minDist = 4.0;
            for (const r of rocksList) {
                if (r.state === 'collected') continue;
                const d = Math.hypot(playerGroup.position.x - r.x, playerGroup.position.z - r.z);
                if (d < minDist) { minDist = d; closestRock = r; }
            }

            for (const r of rocksList) {
                if (r === closestRock) {
                    if (r.state === 'intact') {
                        r.ring.visible = true;
                        r.mesh.scale.lerp(r.baseScale.clone().multiplyScalar(1.18), 0.1);
                        r.mesh.rotation.z = r.baseRotZ + Math.sin(elapsedTime * 35) * 0.05;

                        if (keys.e && !eKeyProcessed) {
                            eKeyProcessed = true;
                            miningAnimationTimer = 1.0;
                            const dmg = pickaxes[currentPickaxeIndex].damage;
                            r.hp -= dmg;
                            showNotification(`Hit ${r.typeName}! (-${dmg} HP) [${Math.max(0, r.hp)}/${r.maxHp}]`);
                            if (r.hp <= 0) { r.state = 'rising'; r.ring.visible = false; }
                        }
                    } else if (r.state === 'rising') {
                        r.riseProgress += 0.05;
                        r.mesh.position.y = r.baseY + Math.min(r.riseProgress * 1.5, 2.0);
                        if (r.riseProgress >= 1.0) {
                            r.state = 'shattered';
                            r.mesh.visible = false;
                            for (let s = 0; s < 6; s++) {
                                const shard = new THREE.Mesh(new THREE.TetrahedronGeometry(0.3, 0), r.mesh.material);
                                shard.position.copy(r.mesh.position);
                                shard.userData = { vel: new THREE.Vector3((Math.random()-0.5)*0.25, Math.random()*0.2+0.1, (Math.random()-0.5)*0.25), rot: new THREE.Vector3(Math.random(), Math.random(), Math.random()) };
                                scene.add(shard); r.shards.push(shard);
                            }
                            const gemMesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.4, 0), new THREE.MeshStandardMaterial({ color: r.tier.ringColor, emissive: r.tier.ringColor, roughness: 0.2, metalness: 0.8 }));
                            gemMesh.position.set(r.x, r.baseY + 1.2, r.z);
                            scene.add(gemMesh); r.gem = gemMesh;
                        }
                    } else if (r.state === 'shattered' && r.gem) {
                        r.gem.position.y = r.baseY + 1.2 + Math.sin(elapsedTime * 4) * 0.2;
                        r.gem.rotation.y += 0.03;
                        if (keys.e && !eKeyProcessed) {
                            eKeyProcessed = true;
                            r.state = 'collected';
                            flyingGems.push({ mesh: r.gem, value: r.tier.gemValue, progress: 0 });
                            r.gem = null;
                            showNotification(`Collected ${r.tier.name} Gem! (+${r.tier.gemValue} Gems)`);
                        }
                    }
                } else if (r.state === 'intact') {
                    r.ring.visible = false;
                    r.mesh.scale.lerp(r.baseScale, 0.1);
                    r.mesh.rotation.z = THREE.MathUtils.lerp(r.mesh.rotation.z, r.baseRotZ, 0.1);
                }

                r.shards.forEach(sh => {
                    sh.position.add(sh.userData.vel);
                    sh.userData.vel.y -= 0.02;
                    if (sh.position.y <= 0.1) { sh.position.y = 0.1; sh.userData.vel.set(0, 0, 0); }
                });
            }

            if (!keys.e) eKeyProcessed = false;

            for (let i = flyingGems.length - 1; i >= 0; i--) {
                const fg = flyingGems[i];
                fg.progress += 0.03;
                const bPos = new THREE.Vector3();
                backpack.getWorldPosition(bPos);
                fg.mesh.position.lerp(bPos, fg.progress);
                fg.mesh.scale.multiplyScalar(0.95);
                if (fg.progress >= 1.0 || fg.mesh.position.distanceTo(bPos) < 0.3) {
                    scene.remove(fg.mesh);
                    flyingGems.splice(i, 1);
                    gemCount += fg.value;
                    updateShopUI();
                }
            }

            headGroup.visible = camDistance > 0.8;
            const targetPos = playerGroup.position.clone().add(new THREE.Vector3(0, 2.4, 0));
            camera.position.set(
                targetPos.x + camDistance * Math.sin(camYaw) * Math.cos(camPitch),
                targetPos.y + camDistance * Math.sin(camPitch),
                targetPos.z + camDistance * Math.cos(camYaw) * Math.cos(camPitch)
            );
            camera.lookAt(targetPos);
            renderer.render(scene, camera);
        }

        updateShopUI();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
