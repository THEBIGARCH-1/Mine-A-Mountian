<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Mining Simulator Ultimate</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none; 
            background: #87ceeb;
        }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 14px 22px;
            border-radius: 10px;
            font-weight: bold;
            pointer-events: none;
            line-height: 1.6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-size: 14px;
        }
        #ui-hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            line-height: 1.5;
        }
        #shop-ui {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 280px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            font-size: 14px;
        }
        #shop-ui h3 {
            margin-top: 0;
            text-align: center;
            color: #ffd700;
            border-bottom: 2px solid #444;
            padding-bottom: 8px;
        }
        .pickaxe-card {
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .pickaxe-card.owned {
            border: 2px solid #00ffaa;
        }
        .pickaxe-card button {
            background: #28a745;
            color: white;
            border: none;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .pickaxe-card button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        #notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: #ffd700;
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="instructions">
        WASD: Fast Move | SHIFT: Sprint | SPACE: Jump<br>
        DRAG MOUSE: Rotate Camera<br>
        <strong>Tap 'E'</strong> near a shaking rock to Mine!
    </div>

    <div id="ui-hud">
        Gems: <span id="gem-count" style="color: #00ffcc;">0</span> 💎<br>
        Pickaxe: <span id="current-pickaxe" style="color: #ffd700;">Rusty Pickaxe</span> (Dmg: <span id="current-damage">1</span>)
    </div>

    <div id="shop-ui">
        <h3>⛏️ Pickaxe Shop</h3>
        <div id="shop-list"></div>
    </div>

    <div id="notification"></div>

    <!-- Three.js CDN Loader with Fallback Check -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        if (typeof THREE === 'undefined') {
            document.body.innerHTML = '<h2 style="color:white; text-align:center; margin-top:20vh;">Error: Failed to load Three.js library. Please check your internet connection.</h2>';
        } else {
            initGame();
        }

        function initGame() {
            let gemCount = 0;
            let currentPickaxeIndex = 0;

            const pickaxes = [
                { name: "Rusty Pickaxe", damage: 1, cost: 0 },
                { name: "Stone Pickaxe", damage: 3, cost: 25 },
                { name: "Iron Pickaxe", damage: 8, cost: 100 },
                { name: "Gold Pickaxe", damage: 20, cost: 400 },
                { name: "Cosmic Pickaxe", damage: 50, cost: 1500 }
            ];

            const rockTiers = [
                { name: "Common", hp: 3, color: 0x555555, ringColor: 0xffffff, gemValue: 1, types: ["Cobblestone", "Basalt", "Pebble", "Granite", "Sandstone"] },
                { name: "Uncommon", hp: 12, color: 0x2e8b57, ringColor: 0x00ff00, gemValue: 5, types: ["Mossy Boulder", "Limestone", "Diorite", "Slate", "Serpentine"] },
                { name: "Rare", hp: 40, color: 0x1e90ff, ringColor: 0x00bfff, gemValue: 20, types: ["Sapphire", "Lapis Ore", "Azurite", "Cobalt", "Sodalite"] },
                { name: "Epic", hp: 120, color: 0x9932cc, ringColor: 0xda70d6, gemValue: 80, types: ["Amethyst", "Ruby", "Garnet", "Topaz", "Morganite"] },
                { name: "Cosmic", hp: 350, color: 0xff4500, ringColor: 0xffd700, gemValue: 300, types: ["Obsidian Core", "Meteorite", "Nether Rock", "Void Crystal", "Monolith"] }
            ];

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dirLight = new THREE.DirectionalLight(0xfffaed, 0.9);
            dirLight.position.set(30, 50, 20);
            scene.add(dirLight);

            // Ground
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(140, 140),
                new THREE.MeshLambertMaterial({ color: 0x1e4112 })
            );
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // Rocks setup
            const rocksList = [];
            const ringGeo = new THREE.RingGeometry(1.0, 1.25, 32);
            ringGeo.rotateX(-Math.PI / 2);

            for (let i = 0; i < 40; i++) {
                let rx = (Math.random() - 0.5) * 100;
                let rz = (Math.random() - 0.5) * 100;
                if (Math.hypot(rx, rz) < 5) rx += 8;

                let tierRoll = Math.random();
                let tierIdx = tierRoll > 0.6 ? (tierRoll > 0.85 ? (tierRoll > 0.95 ? (tierRoll > 0.98 ? 4 : 3) : 2) : 1) : 0;
                let tier = rockTiers[tierIdx];

                let mesh = new THREE.Mesh(
                    new THREE.IcosahedronGeometry(1, 1),
                    new THREE.MeshStandardMaterial({ color: tier.color, roughness: 0.8, flatShading: true })
                );
                mesh.position.set(rx, 0.8, rz);
                mesh.scale.set(0.9, 0.8, 0.9);
                scene.add(mesh);

                let ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: tier.ringColor, side: THREE.DoubleSide }));
                ring.position.set(rx, 0.05, rz);
                ring.visible = false;
                scene.add(ring);

                rocksList.push({ mesh, ring, tier, hp: tier.hp, maxHp: tier.hp, x: rx, z: rz, radius: 1.0, state: 'intact', gem: null });
            }

            // Player character
            const playerGroup = new THREE.Group();
            scene.add(playerGroup);
            
            const skinMat = new THREE.MeshLambertMaterial({ color: 0xffcc99 });
            const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.6), new THREE.MeshLambertMaterial({ color: 0x0066cc }));
            torso.position.y = 1.3;
            playerGroup.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), skinMat);
            head.position.y = 2.4;
            playerGroup.add(head);

            // Controls & States
            let keys = { w: false, a: false, s: false, d: false, shift: false, space: false, e: false };
            window.addEventListener('keydown', e => {
                if (e.code === 'Space') keys.space = true;
                if (e.key === 'Shift') keys.shift = true;
                if (e.key.toLowerCase() === 'e') keys.e = true;
                if (['w','a','s','d'].includes(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
            });
            window.addEventListener('keyup', e => {
                if (e.code === 'Space') keys.space = false;
                if (e.key === 'Shift') keys.shift = false;
                if (e.key.toLowerCase() === 'e') keys.e = false;
                if (['w','a','s','d'].includes(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
            });

            let camYaw = 0, camPitch = 0.3, camDist = 8, isMouseDown = false, eProcessed = false;
            window.addEventListener('mousedown', () => isMouseDown = true);
            window.addEventListener('mouseup', () => isMouseDown = false);
            window.addEventListener('mousemove', e => {
                if (isMouseDown) {
                    camYaw -= e.movementX * 0.005;
                    camPitch = Math.max(-0.2, Math.min(1.4, camPitch + e.movementY * 0.005));
                }
            });

            window.updateShopUI = function() {
                const list = document.getElementById('shop-list');
                list.innerHTML = '';
                pickaxes.forEach((p, idx) => {
                    let owned = idx <= currentPickaxeIndex;
                    let next = idx === currentPickaxeIndex + 1;
                    list.innerHTML += `
                        <div class="pickaxe-card ${owned ? 'owned' : ''}">
                            <div><strong>${p.name}</strong></div>
                            <div style="font-size:12px; color:#aaa;">Damage: +${p.damage}</div>
                            ${!owned ? `<div style="font-size:12px; color:#ffd700;">Cost: ${p.cost} Gems</div>` : ''}
                            ${owned ? '<div style="color:#00ffaa; font-size:12px;">UNLOCKED</div>' : `<button ${!next || gemCount < p.cost ? 'disabled' : ''} onclick="buy(${idx})">Buy</button>`}
                        </div>`;
                });
                document.getElementById('gem-count').innerText = gemCount;
                document.getElementById('current-pickaxe').innerText = pickaxes[currentPickaxeIndex].name;
                document.getElementById('current-damage').innerText = pickaxes[currentPickaxeIndex].damage;
            };

            window.buy = function(idx) {
                if (gemCount >= pickaxes[idx].cost && idx === currentPickaxeIndex + 1) {
                    gemCount -= pickaxes[idx].cost;
                    currentPickaxeIndex = idx;
                    updateShopUI();
                    showNotif(`Unlocked ${pickaxes[idx].name}!`);
                }
            };

            function showNotif(txt) {
                const n = document.getElementById('notification');
                n.innerText = txt;
                n.style.opacity = '1';
                setTimeout(() => n.style.opacity = '0', 2000);
            }

            // Game Loop
            let velY = 0, grounded = true, rot = 0;
            function animate() {
                requestAnimationFrame(animate);

                // Movement
                let xInput = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
                let zInput = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);
                if (xInput !== 0 || zInput !== 0) {
                    let angle = Math.atan2(xInput, zInput) + camYaw;
                    let spd = keys.shift ? 0.35 : 0.2;
                    playerGroup.position.x += Math.sin(angle) * spd;
                    playerGroup.position.z += Math.cos(angle) * spd;
                    rot = angle;
                    playerGroup.rotation.y = rot;
                }

                if (keys.space && grounded) { velY = 0.4; grounded = false; }
                playerGroup.position.y += velY;
                if (!grounded) velY -= 0.02;
                if (playerGroup.position.y <= 0) { playerGroup.position.y = 0; velY = 0; grounded = true; }

                // Rock Interaction
                let closest = null, minDist = 3.5;
                rocksList.forEach(r => {
                    if (r.state === 'collected') return;
                    let d = Math.hypot(playerGroup.position.x - r.x, playerGroup.position.z - r.z);
                    if (d < minDist) { minDist = d; closest = r; }
                });

                rocksList.forEach(r => {
                    if (r === closest && r.state === 'intact') {
                        r.ring.visible = true;
                        if (keys.e && !eProcessed) {
                            eProcessed = true;
                            let dmg = pickaxes[currentPickaxeIndex].damage;
                            r.hp -= dmg;
                            showNotif(`Hit rock! (-${dmg} HP)`);
                            if (r.hp <= 0) {
                                r.state = 'collected';
                                r.mesh.visible = false;
                                r.ring.visible = false;
                                gemCount += r.tier.gemValue;
                                updateShopUI();
                                showNotif(`Found ${r.tier.name} Gem! (+${r.tier.gemValue})`);
                            }
                        }
                    } else if (r.state === 'intact') {
                        r.ring.visible = false;
                    }
                });

                if (!keys.e) eProcessed = false;

                // Camera follow
                let pPos = playerGroup.position.clone().add(new THREE.Vector3(0, 2, 0));
                camera.position.set(
                    pPos.x + camDist * Math.sin(camYaw) * Math.cos(camPitch),
                    pPos.y + camDist * Math.sin(camPitch),
                    pPos.z + camDist * Math.cos(camYaw) * Math.cos(camPitch)
                );
                camera.lookAt(pPos);

                renderer.render(scene, camera);
            }

            updateShopUI();
            animate();
        }
    </script>
</body>
</html>
