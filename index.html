<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Roblox-style Player Movement</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="instructions">Use W, A, S, D to Move</div>

    <!-- Include Three.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. SETUP SCENE, CAMERA, & RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky blue background

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- 2. LIGHTS ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 3. GRASS GROUND ---
        const groundGeometry = new THREE.PlaneGeometry(100, 100);
        const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x55aa44 }); // Grass green
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- 4. CHARACTER MODEL SETUP ---
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        // Materials
        const skinMat = new THREE.MeshLambertMaterial({ color: 0xffcc99 });
        const shirtMat = new THREE.MeshLambertMaterial({ color: 0x0066cc });
        const pantsMat = new THREE.MeshLambertMaterial({ color: 0x333333 });

        // Head
        const headGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const head = new THREE.Mesh(headGeo, skinMat);
        head.position.y = 2.4;
        head.castShadow = true;
        playerGroup.add(head);

        // Torso
        const torsoGeo = new THREE.BoxGeometry(1.2, 1.4, 0.6);
        const torso = new THREE.Mesh(torsoGeo, shirtMat);
        torso.position.y = 1.3;
        torso.castShadow = true;
        playerGroup.add(torso);

        // Left Arm
        const armGeo = new THREE.BoxGeometry(0.4, 1.2, 0.4);
        armGeo.translate(0, -0.5, 0); // Origin at top for pivot swinging
        const leftArm = new THREE.Mesh(armGeo, skinMat);
        leftArm.position.set(-0.8, 1.9, 0);
        leftArm.castShadow = true;
        playerGroup.add(leftArm);

        // Right Arm
        const rightArm = new THREE.Mesh(armGeo, skinMat);
        rightArm.position.set(0.8, 1.9, 0);
        rightArm.castShadow = true;
        playerGroup.add(rightArm);

        // Legs
        const legGeo = new THREE.BoxGeometry(0.5, 1.2, 0.5);
        legGeo.translate(0, -0.5, 0); // Origin at top for pivot swinging

        const leftLeg = new THREE.Mesh(legGeo, pantsMat);
        leftLeg.position.set(-0.35, 0.6, 0);
        leftLeg.castShadow = true;
        playerGroup.add(leftLeg);

        const rightLeg = new THREE.Mesh(legGeo, pantsMat);
        rightLeg.position.set(0.35, 0.6, 0);
        rightLeg.castShadow = true;
        playerGroup.add(rightLeg);

        // --- 5. CONTROLS & MECHANICS ---
        const keys = { w: false, a: false, s: false, d: false };

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
        });

        let walkTimer = 0;
        const speed = 0.12;

        // --- 6. GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            let dx = 0;
            let dz = 0;

            if (keys.w) dz -= 1;
            if (keys.s) dz += 1;
            if (keys.a) dx -= 1;
            if (keys.d) dx += 1;

            const isMoving = dx !== 0 || dz !== 0;

            if (isMoving) {
                // Move player position
                playerGroup.position.x += dx * speed;
                playerGroup.position.z += dz * speed;

                // Face the direction of movement
                const angle = Math.atan2(dx, dz);
                playerGroup.rotation.y = angle;

                // Walking limb animation cycle
                walkTimer += 0.15;
                const swing = Math.sin(walkTimer) * 0.6;
                
                leftArm.rotation.x = swing;
                rightArm.rotation.x = -swing;
                leftLeg.rotation.x = -swing;
                rightLeg.rotation.x = swing;
            } else {
                // Reset limbs to idle pose when standing still
                leftArm.rotation.x = 0;
                rightArm.rotation.x = 0;
                leftLeg.rotation.x = 0;
                rightLeg.rotation.x = 0;
                walkTimer = 0;
            }

            // Roblox Third-Person Camera Follow
            camera.position.x = playerGroup.position.x;
            camera.position.y = playerGroup.position.y + 6;
            camera.position.z = playerGroup.position.z + 10;
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.2, playerGroup.position.z);

            renderer.render(scene, camera);
        }

        animate();

        // Handle window resizing smoothly
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
