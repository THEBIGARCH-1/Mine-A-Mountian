<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mine a Mountain (Roblox Style)</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none; 
            background: #000;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            z-index: 5;
        }

        .hud-box {
            background: rgba(15, 15, 25, 0.85);
            color: white;
            padding: 12px 22px;
            border-radius: 12px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
        }

        #money-display { color: #55ff55; font-size: 22px; text-shadow: 0 0 10px rgba(85,255,85,0.4); }
        #inventory-info { color: #ffcc00; font-size: 15px; }
        #layer-info { color: #00ffff; font-size: 15px; }

        #sell-btn {
            pointer-events: auto;
            background: linear-gradient(135deg, #ff9900, #ff5500);
            color: white;
            border: 2px solid #ffffff;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            text-transform: uppercase;
            box-shadow: 0 6px 15px rgba(255, 153, 0, 0.5);
        }
        #sell-btn:hover { transform: scale(1.05); box-shadow: 0 8px 25px rgba(255, 153, 0, 0.8); }
        #sell-btn:active { transform: scale(0.95); }

        #shop-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 340px;
            max-height: 85vh;
            background: rgba(15, 15, 25, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 18px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            overflow-y: auto;
            z-index: 5;
        }
        
        #shop-title {
            font-size: 22px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }

        .shop-item {
            background: rgba(255, 255, 255, 0.06);
            margin-bottom: 10px;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .shop-item:hover { background: rgba(255, 255, 255, 0.12); }
        .item-info { display: flex; flex-direction: column; }
        .item-name { font-weight: bold; font-size: 15px; color: #fff; }
        .item-stats { font-size: 11px; color: #00ffff; font-weight: bold; margin-top: 3px; }
        .item-cost { font-size: 13px; color: #55ff55; font-weight: 800; margin-top: 3px; }

        .shop-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .shop-btn:hover { background: #34ce57; transform: scale(1.05); }
        .shop-btn.disabled { background: #444; cursor: not-allowed; opacity: 0.5; }
        .shop-btn.active { background: #007bff; cursor: default; }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 13px;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-box" id="money-display">💰 Cash: $0</div>
        <div class="hud-box" id="inventory-info">🎒 Inventory: 0 Ores</div>
        <div class="hud-box" id="layer-info">⛰️ Depth: 0.0m (Grass Surface)</div>
        <button id="sell-btn" onclick="sellOres()">💰 SELL ALL ORES</button>
    </div>

    <div id="shop-container">
        <div id="shop-title">🛠️ TOOL SHOP</div>
        <div id="shop-list"></div>
    </div>

    <div id="instructions">
        🎮 <b>CONTROLS:</b><br>
        • <b>WASD</b>: Move | <b>SHIFT</b>: Sprint | <b>SPACE</b>: Jump<br>
        • <b>DRAG TOUCHPAD / SCREEN</b>: Smooth 360 Camera Rotate<br>
        • <b>PRESS 'Q' or LEFT CLICK</b>: Mine Jagged Pit Underground!
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. GAME ECONOMY & TOOL TIERS ---
        let playerMoney = 0;
        let minedOres = { grass: 0, stone: 0, deepslate: 0, magma: 0, void: 0 };
        let totalOresMined = 0;

        const oreValues = { grass: 2, stone: 8, deepslate: 35, magma: 180, void: 850 };

        const toolsData = [
            { id: 1, name: "Rusty Pick", cost: 0, power: 0.5, speed: 1.0, radius: 1.5, color: 0x8b4513, geo: "pick" },
            { id: 2, name: "Iron Chisel", cost: 250, power: 1.0, speed: 1.4, radius: 1.8, color: 0xaaaaaa, geo: "chisel" },
            { id: 3, name: "Steel Drill", cost: 1800, power: 1.8, speed: 1.8, radius: 2.2, color: 0x4682b4, geo: "drill" },
            { id: 4, name: "Gold Hammer", cost: 12000, power: 3.0, speed: 2.3, radius: 2.6, color: 0xffd700, geo: "pick" },
            { id: 5, name: "Diamond Excavator", cost: 75000, power: 5.0, speed: 3.0, radius: 3.2, color: 0x00ffff, geo: "drill" },
            { id: 6, name: "Magma Buster", cost: 400000, power: 8.5, speed: 4.0, radius: 3.8, color: 0xff4500, geo: "chisel" },
            { id: 7, name: "Plasma Cutter", cost: 2200000, power: 14.0, speed: 5.2, radius: 4.5, color: 0x9400d3, geo: "drill" },
            { id: 8, name: "Void Smasher", cost: 12000000, power: 24.0, speed: 6.8, radius: 5.2, color: 0x111111, geo: "pick" },
            { id: 9, name: "Quantum Annihilator", cost: 45000000, power: 42.0, speed: 8.5, radius: 6.0, color: 0x00ff66, geo: "drill" },
            { id: 10, name: "Galaxy Obliterator", cost: 150000000, power: 80.0, speed: 11.0, radius: 7.2, color: 0xff00ff, geo: "galaxy" }
        ];

        let ownedTools = [true, false, false, false, false, false, false, false, false, false];
        let currentToolIndex = 0;
        let isToolEquipped = true;
        let lastMineTime = 0;
        let swingAnimTimer = 0;

        // --- 2. THREE.JS SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 0.9);
        dirLight.position.set(40, 80, 40);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 3. MULTI-LAYER FLAT TERRAIN WITH JAGGED DEFORMATION ---
        const groundSize = 140;
        const groundSegments = 140;
        const groundGeometry = new THREE.PlaneGeometry(groundSize, groundSize, groundSegments, groundSegments);
        groundGeometry.rotateX(-Math.PI / 2);

        const posAttr = groundGeometry.attributes.position;

        // Dynamic multi-layer depth colors
        const layerColors = [
            { depth: 0, color: new THREE.Color(0x2e6f1a) },    // Grass surface
            { depth: -3, color: new THREE.Color(0x666666) },   // Stone layer
            { depth: -8, color: new THREE.Color(0x282830) },   // Deepslate layer
            { depth: -16, color: new THREE.Color(0xd84315) },  // Magma layer
            { depth: -26, color: new THREE.Color(0x4a148c) }   // Galaxy Void layer
        ];

        const colorAttr = new THREE.BufferAttribute(new Float32Array(posAttr.count * 3), 3);
        groundGeometry.setAttribute('color', colorAttr);

        function updateTerrainColors() {
            for (let i = 0; i < posAttr.count; i++) {
                const y = posAttr.getY(i);
                let vertexColor = layerColors[0].color.clone();

                for (let l = 0; l < layerColors.length - 1; l++) {
                    const c1 = layerColors[l];
                    const c2 = layerColors[l + 1];
                    if (y <= c1.depth && y >= c2.depth) {
                        const factor = (y - c1.depth) / (c2.depth - c1.depth);
                        vertexColor.copy(c1.color).lerp(c2.color, factor);
                        break;
                    } else if (y < layerColors[layerColors.length - 1].depth) {
                        vertexColor.copy(layerColors[layerColors.length - 1].color);
                    }
                }

                colorAttr.setXYZ(i, vertexColor.r, vertexColor.g, vertexColor.b);
            }
            colorAttr.needsUpdate = true;
        }

        updateTerrainColors();

        const groundMaterial = new THREE.MeshLambertMaterial({ 
            vertexColors: true,
            flatShading: true 
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.receiveShadow = true;
        scene.add(ground);

        // Mine Indicator Ring
        const mineRadiusRing = new THREE.Mesh(
            new THREE.RingGeometry(2.0, 2.2, 32),
            new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.6 })
        );
        mineRadiusRing.rotation.x = -Math.PI / 2;
        mineRadiusRing.position.y = 0.08;
        scene.add(mineRadiusRing);

        // --- 4. MINING PARTICLE BURSTS ---
        const particles = [];
        function spawnMiningParticles(pos, hexColor) {
            const particleGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
            const particleMat = new THREE.MeshBasicMaterial({ color: hexColor });
            
            for (let i = 0; i < 12; i++) {
                const p = new THREE.Mesh(particleGeo, particleMat);
                p.position.copy(pos);
                p.userData.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.4,
                    Math.random() * 0.4 + 0.2,
                    (Math.random() - 0.5) * 0.4
                );
                p.userData.life = 1.0;
                scene.add(p);
                particles.push(p);
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.add(p.userData.velocity);
                p.userData.velocity.y -= 0.025;
                p.userData.life -= 0.06;
                p.scale.multiplyScalar(0.92);
                if (p.userData.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }
        }

        // --- 5. ROBLOX CHARACTER & TOOL DISPLAY ---
        const playerGroup = new THREE.Group();
        playerGroup.position.set(0, 0, 0);
        scene.add(playerGroup);

        const skinMat = new THREE.MeshLambertMaterial({ color: 0xffcc99 });
        const shirtMat = new THREE.MeshLambertMaterial({ color: 0x0066cc });
        const pantsMat = new THREE.MeshLambertMaterial({ color: 0x222222 });

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), skinMat);
        head.position.y = 2.0; playerGroup.add(head);

        const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.6), shirtMat);
        torso.position.y = 1.0; playerGroup.add(torso);

        const createLimb = (mat, pos) => {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.5), mat);
            mesh.geometry.translate(0, -0.5, 0);
            mesh.position.copy(pos);
            playerGroup.add(mesh);
            return mesh;
        };

        const leftArm = createLimb(skinMat, new THREE.Vector3(-0.85, 1.6, 0));
        const rightArm = createLimb(skinMat, new THREE.Vector3(0.85, 1.6, 0));
        const leftLeg = createLimb(pantsMat, new THREE.Vector3(-0.35, 0.4, 0));
        const rightLeg = createLimb(pantsMat, new THREE.Vector3(0.35, 0.4, 0));

        const toolContainer = new THREE.Group();
        toolContainer.position.set(0, -0.8, 0.2);
        rightArm.add(toolContainer);

        // --- 6. SHOP & ECONOMY SYSTEM ---
        function sellOres() {
            let earnings = 0;
            for (let type in minedOres) {
                earnings += minedOres[type] * oreValues[type];
                minedOres[type] = 0;
            }
            playerMoney += earnings;
            totalOresMined = 0;
            updateHUD();
            updateShopUI();
        }

        function buildToolMesh(data) {
            const group = new THREE.Group();
            const headMat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.2, metalness: 0.8 });
            const handleMat = new THREE.MeshLambertMaterial({ color: 0x3d2314 });

            const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.2), handleMat);
            handle.rotation.x = Math.PI / 3;
            group.add(handle);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.2, 0.2), headMat);
            head.position.set(0, 0.4, 0.4);
            group.add(head);
            return group;
        }

        function equipTool(index) {
            if (!ownedTools[index]) return;
            currentToolIndex = index;
            isToolEquipped = true;
            toolContainer.visible = true;
            while(toolContainer.children.length > 0) toolContainer.remove(toolContainer.children[0]);
            toolContainer.add(buildToolMesh(toolsData[index]));
            
            // Adjust Mine Radius Indicator
            const r = toolsData[index].radius;
            mineRadiusRing.geometry.dispose();
            mineRadiusRing.geometry = new THREE.RingGeometry(r * 0.9, r, 32);
            
            updateShopUI();
        }

        function buyTool(index) {
            const tool = toolsData[index];
            if (playerMoney >= tool.cost && !ownedTools[index]) {
                playerMoney -= tool.cost;
                ownedTools[index] = true;
                equipTool(index);
                updateHUD();
                updateShopUI();
            }
        }

        const shopListEl = document.getElementById('shop-list');
        function renderShopItems() {
            shopListEl.innerHTML = '';
            toolsData.forEach((tool, idx) => {
                const item = document.createElement('div');
                item.className = 'shop-item';
                item.innerHTML = `
                    <div class="item-info">
                        <span class="item-name">Lvl ${tool.id}: ${tool.name}</span>
                        <span class="item-stats">⚡ PWR: ${tool.power} | 💨 SPD: ${tool.speed}x</span>
                        <span class="item-cost">$${tool.cost.toLocaleString()}</span>
                    </div>
                    <button class="shop-btn" id="btn-tool-${idx}"></button>
                `;
                shopListEl.appendChild(item);
            });
        }
        renderShopItems();

        function updateShopUI() {
            toolsData.forEach((tool, idx) => {
                const btn = document.getElementById(`btn-tool-${idx}`);
                if (ownedTools[idx]) {
                    if (idx === currentToolIndex && isToolEquipped) {
                        btn.innerText = "Equipped";
                        btn.className = "shop-btn active";
                        btn.onclick = null;
                    } else {
                        btn.innerText = "Equip";
                        btn.className = "shop-btn";
                        btn.onclick = () => equipTool(idx);
                    }
                } else {
                    btn.innerText = "Buy";
                    if (playerMoney >= tool.cost) {
                        btn.className = "shop-btn";
                        btn.onclick = () => buyTool(idx);
                    } else {
                        btn.className = "shop-btn disabled";
                        btn.onclick = null;
                    }
                }
            });
        }

        function updateHUD() {
            document.getElementById('money-display').innerText = `💰 Cash: $${playerMoney.toLocaleString()}`;
            document.getElementById('inventory-info').innerText = `🎒 Inventory: ${totalOresMined} Ores`;
            
            const depth = Math.abs(Math.min(0, playerGroup.position.y)).toFixed(1);
            let layerName = "Grass Surface";
            if (playerGroup.position.y < -26) layerName = "Galaxy Void Layer";
            else if (playerGroup.position.y < -16) layerName = "Magma Layer";
            else if (playerGroup.position.y < -8) layerName = "Deepslate Layer";
            else if (playerGroup.position.y < -3) layerName = "Stone Layer";
            
            document.getElementById('layer-info').innerText = `⛰️ Depth: ${depth}m (${layerName})`;
        }

        equipTool(0);

        // --- 7. JAGGED MINING DEFORMATION MECHANIC ---
        function triggerMine() {
            if (!isToolEquipped) return;

            const tool = toolsData[currentToolIndex];
            const now = performance.now();
            const cooldown = 500 / tool.speed;
            if (now - lastMineTime < cooldown) return;

            lastMineTime = now;
            swingAnimTimer = 1.0;

            deformJaggedGround(mineRadiusRing.position, tool.power, tool.radius);
        }

        function deformJaggedGround(center, power, radius) {
            let oresAdded = 0;
            let currentLayerType = "grass";

            for (let i = 0; i < posAttr.count; i++) {
                const vx = posAttr.getX(i);
                const vy = posAttr.getY(i);
                const vz = posAttr.getZ(i);

                const dist = Math.sqrt((vx - center.x) ** 2 + (vz - center.z) ** 2);

                if (dist < radius) {
                    // JAGGED NOISE FACTORS
                    const jaggedNoise = (Math.sin(vx * 3.5) * Math.cos(vz * 3.5) * 0.4) + (Math.random() * 0.3);
                    const depthDrop = (1.0 - (dist / radius)) * power * (0.8 + jaggedNoise);

                    const newY = vy - depthDrop;
                    posAttr.setY(i, newY);

                    // Track ore layer type collected
                    if (newY < -26) currentLayerType = "void";
                    else if (newY < -16) currentLayerType = "magma";
                    else if (newY < -8) currentLayerType = "deepslate";
                    else if (newY < -3) currentLayerType = "stone";

                    oresAdded++;
                }
            }

            posAttr.needsUpdate = true;
            updateTerrainColors();
            groundGeometry.computeVertexNormals();

            if (oresAdded > 0) {
                const minedAmount = Math.max(1, Math.floor(power * 2.5));
                minedOres[currentLayerType] += minedAmount;
                totalOresMined += minedAmount;

                const col = layerColors.find(l => center.y <= l.depth)?.color.getHex() || 0x2e6f1a;
                spawnMiningParticles(center.clone().add(new THREE.Vector3(0, 0.5, 0)), col);
            }

            updateHUD();
            updateShopUI();
        }

        // --- 8. TOUCHPAD TURNING & KEYBOARD CONTROLS ---
        let camYaw = 0, camPitch = 0.3, camDistance = 9.0;
        let isTouchingOrDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        window.addEventListener('mousedown', e => {
            if (e.target.closest('#shop-container') || e.target.closest('#hud')) return;
            isTouchingOrDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', e => {
            if (isTouchingOrDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                camYaw -= deltaX * 0.006;
                camPitch += deltaY * 0.006;
                camPitch = Math.max(-0.2, Math.min(Math.PI / 2 - 0.05, camPitch));

                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        window.addEventListener('mouseup', () => isTouchingOrDragging = false);

        window.addEventListener('click', (e) => {
            if (e.target.closest('#shop-container') || e.target.closest('#hud')) return;
            triggerMine();
        });

        const keys = { w: false, a: false, s: false, d: false, space: false, shift: false };

        window.addEventListener('keydown', e => {
            if (e.code === "Space") keys.space = true;
            if (e.key === "Shift" || e.code === "ShiftLeft") keys.shift = true;
            if (e.key.toLowerCase() === 'q') triggerMine(); // PRESS Q TO DESTROY/MINE!
            if (e.key.toLowerCase() === 'e') {
                isToolEquipped = !isToolEquipped;
                toolContainer.visible = isToolEquipped;
                updateShopUI();
            }
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = true;
        });

        window.addEventListener('keyup', e => {
            if (e.code === "Space") keys.space = false;
            if (e.key === "Shift" || e.code === "ShiftLeft") keys.shift = false;
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false;
        });

        // --- 9. PLAYER MOVEMENT & TERRAIN COLLISION ---
        function getGroundHeightAt(x, z) {
            const gridX = Math.floor((x + groundSize / 2) / groundSize * groundSegments);
            const gridZ = Math.floor((z + groundSize / 2) / groundSize * groundSegments);

            if (gridX >= 0 && gridX < groundSegments && gridZ >= 0 && gridZ < groundSegments) {
                const index = gridZ * (groundSegments + 1) + gridX;
                return posAttr.getY(index);
            }
            return 0;
        }

        let playerVelocityY = 0;
        let isGrounded = true;
        let walkTimer = 0;

        // --- 10. MAIN ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Ground Collision & Gravity
            const currentTerrainY = getGroundHeightAt(playerGroup.position.x, playerGroup.position.z);
            
            if (keys.space && isGrounded) {
                playerVelocityY = 0.35;
                isGrounded = false;
            }

            playerGroup.position.y += playerVelocityY;

            if (playerGroup.position.y <= currentTerrainY) {
                playerGroup.position.y = currentTerrainY;
                playerVelocityY = 0;
                isGrounded = true;
            } else {
                playerVelocityY -= 0.015; // Gravity
            }

            // Indicator follows target ground surface
            mineRadiusRing.position.x = playerGroup.position.x;
            mineRadiusRing.position.z = playerGroup.position.z;
            mineRadiusRing.position.y = currentTerrainY + 0.08;

            // Character Movement
            const currentSpeed = keys.shift ? 0.25 : 0.13;
            let inputX = 0, inputZ = 0;
            if (keys.w) inputZ -= 1;
            if (keys.s) inputZ += 1;
            if (keys.a) inputX -= 1;
            if (keys.d) inputX += 1;

            if (inputX !== 0 || inputZ !== 0) {
                const targetAngle = Math.atan2(inputX, inputZ) + camYaw;
                playerGroup.position.x += Math.sin(targetAngle) * currentSpeed;
                playerGroup.position.z += Math.cos(targetAngle) * currentSpeed;
                playerGroup.rotation.y = targetAngle;

                walkTimer += 0.2;
                const swing = Math.sin(walkTimer) * 0.6;
                leftArm.rotation.x = swing;
                if (isToolEquipped) rightArm.rotation.x = -Math.PI / 4 + (swing * 0.3);
                else rightArm.rotation.x = -swing;
                leftLeg.rotation.x = -swing;
                rightLeg.rotation.x = swing;
            } else {
                leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, 0, 0.1);
                if (isToolEquipped) rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, -Math.PI / 4, 0.1);
                else rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, 0, 0.1);
                leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, 0, 0.1);
                rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, 0, 0.1);
            }

            // Mining Swing Animation Override
            if (swingAnimTimer > 0) {
                swingAnimTimer -= 0.1 * toolsData[currentToolIndex].speed;
                rightArm.rotation.x = -Math.PI / 1.5;
            }

            // Camera Tracking
            const targetPos = playerGroup.position.clone().add(new THREE.Vector3(0, 2.2, 0));
            camera.position.set(
                targetPos.x + camDistance * Math.sin(camYaw) * Math.cos(camPitch),
                targetPos.y + camDistance * Math.sin(camPitch),
                targetPos.z + camDistance * Math.cos(camYaw) * Math.cos(camPitch)
            );
            camera.lookAt(targetPos);

            updateParticles();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
