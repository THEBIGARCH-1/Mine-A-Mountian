<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Turning Bacon Hair Roblox Character</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; user-select: none; }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            pointer-events: none;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="instructions">
        WASD to Move (Smooth Turning)<br>
        Touchpad / Mouse: Drag to Rotate Camera<br>
        Press 'I' to Zoom In | Press 'O' to Zoom Out
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- 2. LIGHTS ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 0.9);
        dirLight.position.set(30, 50, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 3. DENSE INTERACTIVE GRASS ---
        const grassGeometry = new THREE.PlaneGeometry(0.1, 0.6, 1, 4);
        grassGeometry.translate(0, 0.3, 0); 

        const grassMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                attribute float phase;
                uniform float time;
                uniform vec3 playerPos;
                varying float vHeight;

                void main() {
                    vHeight = position.y / 0.6;
                    vec3 worldPos = (instanceMatrix * vec4(position, 1.0)).xyz;
                    vec3 pos = position;

                    float wave = sin(time * 3.0 + phase) * 0.08 * pow(vHeight, 2.0);
                    pos.x += wave;

                    float dist = distance(worldPos.xz, playerPos.xz);
                    float pushRadius = 1.2;

                    if (dist < pushRadius) {
                        float pushFactor = (1.0 - (dist / pushRadius)) * pow(vHeight, 1.2);
                        vec2 pushDir = normalize(worldPos.xz - playerPos.xz + vec2(0.001));
                        
                        pos.x += pushDir.x * pushFactor * 0.8;
                        pos.z += pushDir.y * pushFactor * 0.8;
                        pos.y -= pushFactor * 0.45;
                    }

                    vec4 mvPosition = modelViewMatrix * instanceMatrix * vec4(pos, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying float vHeight;
                void main() {
                    vec3 baseColor = vec3(0.08, 0.35, 0.05);
                    vec3 tipColor = vec3(0.45, 0.8, 0.15);
                    vec3 finalColor = mix(baseColor, tipColor, vHeight);
                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `,
            uniforms: { 
                time: { value: 0 },
                playerPos: { value: new THREE.Vector3() }
            },
            side: THREE.DoubleSide
        });

        const grassCount = 60000;
        const grassField = new THREE.InstancedMesh(grassGeometry, grassMaterial, grassCount);
        const dummy = new THREE.Object3D();
        const phases = new Float32Array(grassCount);

        for (let i = 0; i < grassCount; i++) {
            dummy.position.set(
                (Math.random() - 0.5) * 100,
                0,
                (Math.random() - 0.5) * 100
            );
            dummy.rotation.y = Math.random() * Math.PI * 2;
            const scale = 0.8 + Math.random() * 0.4;
            dummy.scale.set(scale, scale, scale);
            dummy.updateMatrix();
            grassField.setMatrixAt(i, dummy.matrix);
            phases[i] = Math.random() * Math.PI * 2;
        }
        grassGeometry.setAttribute('phase', new THREE.InstancedBufferAttribute(phases, 1));
        scene.add(grassField);

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(120, 120),
            new THREE.MeshLambertMaterial({ color: 0x1e4112 })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // --- 4. DYNAMIC ROBLOX FACE TEXTURE ---
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');

        // Yellow background skin fill for face area
        ctx.fillStyle = '#ffcc99';
        ctx.fillRect(0, 0, 256, 256);

        // Eyes
        ctx.fillStyle = '#111111';
        ctx.beginPath();
        ctx.arc(80, 110, 14, 0, Math.PI * 2);
        ctx.arc(176, 110, 14, 0, Math.PI * 2);
        ctx.fill();

        // Eye shine dots
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(75, 105, 4, 0, Math.PI * 2);
        ctx.arc(171, 105, 4, 0, Math.PI * 2);
        ctx.fill();

        // Smile
        ctx.lineWidth = 8;
        ctx.strokeStyle = '#111111';
        ctx.beginPath();
        ctx.arc(128, 140, 45, 0.1 * Math.PI, 0.9 * Math.PI, false);
        ctx.stroke();

        const faceTexture = new THREE.CanvasTexture(canvas);

        // --- 5. BACON HAIR CHARACTER MODEL ---
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        const skinMat = new THREE.MeshLambertMaterial({ color: 0xffcc99 });
        const faceMat = new THREE.MeshLambertMaterial({ map: faceTexture });
        const shirtMat = new THREE.MeshLambertMaterial({ color: 0x0066cc });
        const pantsMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
        const baconHairMat = new THREE.MeshLambertMaterial({ color: 0x5a2d0c }); // Dark brownish bacon hair tint

        // Cylinder Head (Roblox Style)
        const headGroup = new THREE.Group();
        headGroup.position.y = 2.4;

        // Cylinder head materials: side 0 gets face, others get skin
        const headMaterials = [
            skinMat, // side
            skinMat, // top
            skinMat, // bottom
        ];
        
        const headMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.8, 24), skinMat);
        headGroup.add(headMesh);

        // Face Plane Overlay
        const facePlane = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.7), faceMat);
        facePlane.position.set(0, 0, 0.46);
        headGroup.add(facePlane);

        // Bacon Hair Strands
        const strand1 = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.15, 0.7), baconHairMat);
        strand1.position.set(0, 0.42, 0);
        headGroup.add(strand1);

        const strand2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.8), baconHairMat);
        strand2.position.set(-0.25, 0.35, 0.1);
        strand2.rotation.z = 0.2;
        headGroup.add(strand2);

        const strand3 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.8), baconHairMat);
        strand3.position.set(0.25, 0.35, 0.1);
        strand3.rotation.z = -0.2;
        headGroup.add(strand3);

        playerGroup.add(headGroup);

        // Torso
        const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.6), shirtMat);
        torso.position.y = 1.3;
        playerGroup.add(torso);

        // Limbs
        const createLimb = (geo, mat, pos) => {
            geo.translate(0, -0.5, 0);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            playerGroup.add(mesh);
            return mesh;
        };

        const leftArm = createLimb(new THREE.BoxGeometry(0.4, 1.2, 0.4), skinMat, new THREE.Vector3(-0.8, 1.9, 0));
        const rightArm = createLimb(new THREE.BoxGeometry(0.4, 1.2, 0.4), skinMat, new THREE.Vector3(0.8, 1.9, 0));
        const leftLeg = createLimb(new THREE.BoxGeometry(0.5, 1.2, 0.5), pantsMat, new THREE.Vector3(-0.35, 0.6, 0));
        const rightLeg = createLimb(new THREE.BoxGeometry(0.5, 1.2, 0.5), pantsMat, new THREE.Vector3(0.35, 0.6, 0));

        // --- 6. SMOOTH TURNING & CONTROLS ---
        const keys = { w: false, a: false, s: false, d: false, i: false, o: false };
        window.addEventListener('keydown', e => { 
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = true; 
        });
        window.addEventListener('keyup', e => { 
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false; 
        });

        let camYaw = 0;
        let camPitch = 0.3;
        let camDistance = 8.0;
        let isDragging = false;

        window.addEventListener('mousedown', () => isDragging = true);
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('contextmenu', e => e.preventDefault());

        window.addEventListener('mousemove', e => {
            if (isDragging) {
                camYaw -= e.movementX * 0.005;
                camPitch += e.movementY * 0.005;
                camPitch = Math.max(-0.2, Math.min(Math.PI / 2 - 0.1, camPitch));
            }
        });

        window.addEventListener('wheel', e => {
            camDistance += e.deltaY * 0.005;
            camDistance = Math.max(0, Math.min(25, camDistance));
        });

        let currentRotation = 0;
        let walkTimer = 0;
        const speed = 0.12;

        // --- 7. GAME LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            grassMaterial.uniforms.time.value = elapsedTime;
            grassMaterial.uniforms.playerPos.value.copy(playerGroup.position);

            if (keys.i) camDistance = Math.max(0, camDistance - 0.2);
            if (keys.o) camDistance = Math.min(25, camDistance + 0.2);

            let inputX = 0;
            let inputZ = 0;

            if (keys.w) inputZ -= 1;
            if (keys.s) inputZ += 1;
            if (keys.a) inputX -= 1;
            if (keys.d) inputX += 1;

            const isMoving = inputX !== 0 || inputZ !== 0;

            if (isMoving) {
                const targetAngle = Math.atan2(inputX, inputZ) + camYaw;

                // Move position
                playerGroup.position.x += Math.sin(targetAngle) * speed;
                playerGroup.position.z += Math.cos(targetAngle) * speed;

                // Ultra-Smooth Rotation Interpolation (Prevents robotic snapping)
                let diff = targetAngle - currentRotation;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                currentRotation += diff * 0.12; // Smooth turn rate

                playerGroup.rotation.y = currentRotation;

                walkTimer += 0.18;
                const swing = Math.sin(walkTimer) * 0.6;
                leftArm.rotation.x = swing;
                rightArm.rotation.x = -swing;
                leftLeg.rotation.x = -swing;
                rightLeg.rotation.x = swing;
            } else {
                leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, 0, 0.1);
                rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, 0, 0.1);
                leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, 0, 0.1);
                rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, 0, 0.1);
            }

            headGroup.visible = camDistance > 0.8;

            const targetPos = playerGroup.position.clone().add(new THREE.Vector3(0, 2.4, 0));

            const camX = targetPos.x + camDistance * Math.sin(camYaw) * Math.cos(camPitch);
            const camY = targetPos.y + camDistance * Math.sin(camPitch);
            const camZ = targetPos.z + camDistance * Math.cos(camYaw) * Math.cos(camPitch);

            camera.position.set(camX, camY, camZ);
            camera.lookAt(targetPos);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
