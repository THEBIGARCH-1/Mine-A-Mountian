<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Multi-Layer Mining Game</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 14px 22px;
            border-radius: 10px;
            font-weight: bold;
            pointer-events: none;
            line-height: 1.6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #layer-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #00ffcc;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }
        #shop-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            max-height: 85vh;
            background: rgba(20, 20, 20, 0.88);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            overflow-y: auto;
        }
        #shop-title {
            font-size: 20px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffcc00;
        }
        .shop-item {
            background: rgba(255, 255, 255, 0.08);
            margin-bottom: 8px;
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .shop-item:hover { background: rgba(255, 255, 255, 0.15); }
        .item-info { display: flex; flex-direction: column; }
        .item-name { font-weight: bold; font-size: 14px; color: #fff; }
        .item-stats { font-size: 11px; color: #00ffcc; font-weight: bold; margin-top: 2px; }
        .item-desc { font-size: 10px; color: #aaa; }
        .shop-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .shop-btn:hover { background: #34ce57; transform: scale(1.05); }
        .shop-btn.active { background: #007bff; cursor: default; }
    </style>
</head>
<body>

    <div id="instructions">
        WASD: Move | SHIFT: Sprint | SPACE: Jump<br>
        E: Equip / Unequip Tool<br>
        LEFT-CLICK Ground: Mine Underground Layers<br>
        RIGHT-CLICK / Drag: Rotate Camera
    </div>

    <div id="layer-info">Current Depth: 0.0m (Grass Layer)</div>

    <!-- Shop UI -->
    <div id="shop-container">
        <div id="shop-title">🛠️ Tool Shop</div>
        <div id="shop-list"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false; // Disabled shadows for high performance boost
        document.body.appendChild(renderer.domElement);

        // --- 2. LIGHTS ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
        dirLight.position.set(30, 50, 20);
        scene.add(dirLight);

        // --- 3. MULTI-LAYER TERRAIN & COLOR SYSTEM ---
        const groundSize = 120;
        // Optimization: Reduced segment resolution from 120 to 60 for significantly higher FPS
        const groundSegments = 60;
        const groundGeometry = new THREE.PlaneGeometry(groundSize, groundSize, groundSegments, groundSegments);
        groundGeometry.rotateX(-Math.PI / 2);

        // Expanded layer depth mapping (deeper limits)
        const layerColors = [
            { depth: 0, color: new THREE.Color(0x1e4112) },    // Grass
            { depth: -5, color: new THREE.Color(0x555555) },   // Stone
            { depth: -15, color: new THREE.Color(0x22222a) },  // Deepslate
            { depth: -35, color: new THREE.Color(0xc43000) },  // Magma / Lava
            { depth: -60, color: new THREE.Color(0x4b0082) },  // Galaxy Void
            { depth: -100, color: new THREE.Color(0x050010) }  // Core Abyss
        ];

        const posAttr = groundGeometry.attributes.position;
        const colorAttr = new THREE.BufferAttribute(new Float32Array(posAttr.count * 3), 3);
        groundGeometry.setAttribute('color', colorAttr);

        function updateTerrainColors() {
            for (let i = 0; i < posAttr.count; i++) {
                const y = posAttr.getY(i);
                let vertexColor = layerColors[0].color.clone();

                for (let l = 0; l < layerColors.length - 1; l++) {
                    const c1 = layerColors[l];
                    const c2 = layerColors[l + 1];
                    if (y <= c1.depth && y >= c2.depth) {
                        const factor = (y - c1.depth) / (c2.depth - c1.depth);
                        vertexColor.copy(c1.color).lerp(c2.color, factor);
                        break;
                    } else if (y < layerColors[layerColors.length - 1].depth) {
                        vertexColor.copy(layerColors[layerColors.length - 1].color);
                    }
                }

                colorAttr.setXYZ(i, vertexColor.r, vertexColor.g, vertexColor.b);
            }
            colorAttr.needsUpdate = true;
        }

        updateTerrainColors();

        const groundMaterial = new THREE.MeshLambertMaterial({ 
            vertexColors: true,
            flatShading: true
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        scene.add(ground);

        // Mining Reach Indicator Ring
        const mineRadiusRing = new THREE.Mesh(
            new THREE.RingGeometry(4.8, 5.0, 32),
            new THREE.MeshBasicMaterial({ color: 0xffff00, side: THREE.DoubleSide, transparent: true, opacity: 0.5 })
        );
        mineRadiusRing.rotation.x = -Math.PI / 2;
        mineRadiusRing.position.y = 0.05;
        scene.add(mineRadiusRing);

        // --- 4. OPTIMIZED INSTANCED GRASS FIELD ---
        const grassGeometry = new THREE.PlaneGeometry(0.1, 0.6, 1, 2);
        grassGeometry.translate(0, 0.3, 0); 

        const grassMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                attribute float phase;
                uniform float time;
                uniform vec3 playerPos;
                varying float vHeight;

                void main() {
                    vHeight = position.y / 0.6;
                    vec3 worldPos = (instanceMatrix * vec4(position, 1.0)).xyz;
                    vec3 pos = position;

                    float wave = sin(time * 3.0 + phase) * 0.08 * pow(vHeight, 2.0);
                    pos.x += wave;

                    float dist = distance(worldPos.xz, playerPos.xz);
                    float pushRadius = 1.2;

                    if (dist < pushRadius) {
                        float pushFactor = (1.0 - (dist / pushRadius)) * pow(vHeight, 1.2);
                        vec2 pushDir = normalize(worldPos.xz - playerPos.xz + vec2(0.001));
                        
                        pos.x += pushDir.x * pushFactor * 0.8;
                        pos.z += pushDir.y * pushFactor * 0.8;
                        pos.y -= pushFactor * 0.45;
                    }

                    vec4 mvPosition = modelViewMatrix * instanceMatrix * vec4(pos, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying float vHeight;
                void main() {
                    vec3 baseColor = vec3(0.08, 0.35, 0.05);
                    vec3 tipColor = vec3(0.45, 0.8, 0.15);
                    vec3 finalColor = mix(baseColor, tipColor, vHeight);
                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `,
            uniforms: { 
                time: { value: 0 },
                playerPos: { value: new THREE.Vector3() }
            },
            side: THREE.DoubleSide
        });

        // Optimization: Reduced instances from 40,000 to 8,000 to eliminate stuttering
        const grassCount = 8000;
        const grassField = new THREE.InstancedMesh(grassGeometry, grassMaterial, grassCount);
        const dummy = new THREE.Object3D();
        const phases = new Float32Array(grassCount);

        for (let i = 0; i < grassCount; i++) {
            dummy.position.set(
                (Math.random() - 0.5) * 110,
                0,
                (Math.random() - 0.5) * 110
            );
            dummy.rotation.y = Math.random() * Math.PI * 2;
            const scale = 0.8 + Math.random() * 0.4;
            dummy.scale.set(scale, scale, scale);
            dummy.updateMatrix();
            grassField.setMatrixAt(i, dummy.matrix);
            phases[i] = Math.random() * Math.PI * 2;
        }
        grassGeometry.setAttribute('phase', new THREE.InstancedBufferAttribute(phases, 1));
        scene.add(grassField);

        // --- 5. ROBLOX FACE & BACON HAIR CHARACTER ---
        const canvas = document.createElement('canvas');
        canvas.width = 128; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffcc99'; ctx.fillRect(0, 0, 128, 128);
        ctx.fillStyle = '#111111';
        ctx.beginPath(); ctx.arc(40, 55, 7, 0, Math.PI * 2); ctx.arc(88, 55, 7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(37, 52, 2, 0, Math.PI * 2); ctx.arc(85, 52, 2, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = 4; ctx.strokeStyle = '#111111';
        ctx.beginPath(); ctx.arc(64, 70, 22, 0.1 * Math.PI, 0.9 * Math.PI, false); ctx.stroke();
        const faceTexture = new THREE.CanvasTexture(canvas);

        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        const skinMat = new THREE.MeshLambertMaterial({ color: 0xffcc99 });
        const faceMat = new THREE.MeshLambertMaterial({ map: faceTexture });
        const shirtMat = new THREE.MeshLambertMaterial({ color: 0x0066cc });
        const pantsMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
        const baconHairMat = new THREE.MeshLambertMaterial({ color: 0x5a2d0c });

        const headGroup = new THREE.Group();
        headGroup.position.y = 2.4;
        const headMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.8, 16), skinMat);
        headGroup.add(headMesh);
        const facePlane = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.7), faceMat);
        facePlane.position.set(0, 0, 0.46);
        headGroup.add(facePlane);

        const strand1 = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.15, 0.7), baconHairMat);
        strand1.position.set(0, 0.42, 0); headGroup.add(strand1);
        const strand2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.8), baconHairMat);
        strand2.position.set(-0.25, 0.35, 0.1); strand2.rotation.z = 0.2; headGroup.add(strand2);
        const strand3 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.8), baconHairMat);
        strand3.position.set(0.25, 0.35, 0.1); strand3.rotation.z = -0.2; headGroup.add(strand3);
        playerGroup.add(headGroup);

        const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.6), shirtMat);
        torso.position.y = 1.3;
        playerGroup.add(torso);

        const createLimb = (geo, mat, pos) => {
            geo.translate(0, -0.5, 0);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            playerGroup.add(mesh);
            return mesh;
        };

        const leftArm = createLimb(new THREE.BoxGeometry(0.4, 1.2, 0.4), skinMat, new THREE.Vector3(-0.8, 1.9, 0));
        const rightArm = createLimb(new THREE.BoxGeometry(0.4, 1.2, 0.4), skinMat, new THREE.Vector3(0.8, 1.9, 0));
        const leftLeg = createLimb(new THREE.BoxGeometry(0.5, 1.2, 0.5), pantsMat, new THREE.Vector3(-0.35, 0.6, 0));
        const rightLeg = createLimb(new THREE.BoxGeometry(0.5, 1.2, 0.5), pantsMat, new THREE.Vector3(0.35, 0.6, 0));

        const toolContainer = new THREE.Group();
        toolContainer.position.set(0, -1.0, 0.3);
        rightArm.add(toolContainer);

        // --- 6. 10 TOOL TIERS (BUFFED STATS & DEEP DIGGING) ---
        const toolsData = [
            { id: 1, name: "Rusty Chisel", desc: "Old corroded iron", color: 0x8b4513, geo: "chisel", power: 1.2, speed: 1.2, radius: 1.5 },
            { id: 2, name: "Iron Pick", desc: "Basic sturdy iron", color: 0xaaaaaa, geo: "pick", power: 2.2, speed: 1.5, radius: 1.8 },
            { id: 3, name: "Steel Drill", desc: "Tempered steel point", color: 0x4682b4, geo: "drill", power: 3.8, speed: 1.8, radius: 2.2 },
            { id: 4, name: "Gold Chisel", desc: "Fast heavy gold", color: 0xffd700, geo: "chisel", power: 5.5, speed: 2.4, radius: 2.5 },
            { id: 5, name: "Diamond Pick", desc: "Crystallized diamond", color: 0x00ffff, geo: "pick", power: 7.5, speed: 2.8, radius: 3.0 },
            { id: 6, name: "Magma Breaker", desc: "Molten lava power", color: 0xff4500, geo: "drill", power: 10.0, speed: 3.2, radius: 3.5 },
            { id: 7, name: "Plasma Dagger", desc: "Ionized high speed", color: 0x9400d3, geo: "chisel", power: 13.5, speed: 3.8, radius: 4.0 },
            { id: 8, name: "Void Scythe", desc: "Deepslate destructive", color: 0x111111, geo: "pick", power: 17.5, speed: 4.5, radius: 4.5 },
            { id: 9, name: "Quantum Beam", desc: "Fast particle laser", color: 0x00ff66, geo: "drill", power: 23.0, speed: 5.5, radius: 5.2 },
            { id: 10, name: "Galaxy Drill", desc: "Ultimate cosmic drill", color: 0xff00ff, geo: "galaxy", power: 30.0, speed: 7.0, radius: 6.0 }
        ];

        let currentToolIndex = 0;
        let isToolEquipped = true;
        let lastMineTime = 0;
        let swingAnimTimer = 0;

        function buildToolMesh(data) {
            const group = new THREE.Group();
            const handleMat = new THREE.MeshLambertMaterial({ color: 0x3d2314 });
            const headMat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.3, metalness: 0.8 });

            if (data.geo === "chisel") {
                const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.8, 8), handleMat);
                handle.rotation.x = Math.PI / 3;
                group.add(handle);

                const blade = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.4, 0.04), headMat);
                blade.position.set(0, 0.3, 0.3);
                blade.rotation.x = Math.PI / 3;
                group.add(blade);
            } else if (data.geo === "pick") {
                const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.2, 8), handleMat);
                handle.rotation.x = Math.PI / 4;
                group.add(handle);

                const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.1, 0.1), headMat);
                head.position.set(0, 0.4, 0.4);
                group.add(head);
            } else if (data.geo === "drill" || data.geo === "galaxy") {
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.7, 12), headMat);
                body.rotation.x = Math.PI / 2;
                group.add(body);

                const tip = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.6, 12), 
                    new THREE.MeshStandardMaterial({ color: data.color, emissive: data.color, emissiveIntensity: 0.5 }));
                tip.rotation.x = -Math.PI / 2;
                tip.position.set(0, 0, 0.5);
                group.add(tip);

                if (data.geo === "galaxy") {
                    const ringGeo = new THREE.TorusGeometry(0.35, 0.04, 8, 24);
                    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.position.set(0, 0, 0.2);
                    group.add(ring);
                }
            }
            return group;
        }

        function equipTool(index) {
            currentToolIndex = index;
            isToolEquipped = true;
            toolContainer.visible = true;
            while(toolContainer.children.length > 0) {
                toolContainer.remove(toolContainer.children[0]);
            }
            const newTool = buildToolMesh(toolsData[index]);
            toolContainer.add(newTool);
            updateShopUI();
        }

        const shopListEl = document.getElementById('shop-list');
        toolsData.forEach((tool, idx) => {
            const item = document.createElement('div');
            item.className = 'shop-item';
            item.innerHTML = `
                <div class="item-info">
                    <span class="item-name">Lvl ${tool.id}: ${tool.name}</span>
                    <span class="item-stats">⚡ PWR: ${tool.power} | 💨 SPD: ${tool.speed}x</span>
                    <span class="item-desc">${tool.desc}</span>
                </div>
                <button class="shop-btn" id="btn-tool-${idx}" onclick="equipTool(${idx})">Equip</button>
            `;
            shopListEl.appendChild(item);
        });

        function updateShopUI() {
            toolsData.forEach((_, idx) => {
                const btn = document.getElementById(`btn-tool-${idx}`);
                if (idx === currentToolIndex && isToolEquipped) {
                    btn.innerText = "Equipped";
                    btn.className = "shop-btn active";
                } else {
                    btn.innerText = "Equip";
                    btn.className = "shop-btn";
                }
            });
        }

        equipTool(0);

        // --- 7. MINING & DESTRUCTION LOGIC ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (e) => {
            if (e.target.closest('#shop-container')) return;
            if (!isToolEquipped) return;

            const tool = toolsData[currentToolIndex];
            const now = performance.now();
            const cooldown = 450 / tool.speed; 

            if (now - lastMineTime < cooldown) return; 

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(ground);

            if (intersects.length > 0) {
                const hitPoint = intersects[0].point;
                const distToPlayer = playerGroup.position.distanceTo(hitPoint);

                if (distToPlayer <= 6.5) {
                    lastMineTime = now;
                    swingAnimTimer = 1.0; 
                    deformGround(hitPoint, tool.power, tool.radius);
                }
            }
        });

        function deformGround(center, power, radius) {
            for (let i = 0; i < posAttr.count; i++) {
                const vx = posAttr.getX(i);
                const vy = posAttr.getY(i);
                const vz = posAttr.getZ(i);

                const dist = Math.sqrt((vx - center.x) ** 2 + (vz - center.z) ** 2);
                if (dist < radius) {
                    // Removed depth restrictions to allow deep digging into lower layers!
                    const depth = (1 - (dist / radius)) * (power * 0.35);
                    posAttr.setY(i, vy - depth);
                }
            }
            posAttr.needsUpdate = true;
            updateTerrainColors();
            groundGeometry.computeVertexNormals();
        }

        // --- TERRAIN HEIGHT SAMPLER FOR PHYSICS ---
        function getTerrainHeightAt(x, z) {
            const halfSize = groundSize / 2;
            const gridX = (x + halfSize) / groundSize * groundSegments;
            const gridZ = (z + halfSize) / groundSize * groundSegments;

            const ix = Math.floor(Math.max(0, Math.min(groundSegments - 1, gridX)));
            const iz = Math.floor(Math.max(0, Math.min(groundSegments - 1, gridZ)));

            const index = iz * (groundSegments + 1) + ix;
            if (index >= 0 && index < posAttr.count) {
                return posAttr.getY(index);
            }
            return 0;
        }

        // --- 8. CONTROLS & PHYSICS ---
        const keys = { w: false, a: false, s: false, d: false, i: false, o: false, space: false, shift: false };
        
        window.addEventListener('keydown', e => { 
            if (e.code === "Space") keys.space = true;
            if (e.key === "Shift" || e.code === "ShiftLeft") keys.shift = true;
            
            if (e.key.toLowerCase() === 'e') {
                isToolEquipped = !isToolEquipped;
                toolContainer.visible = isToolEquipped;
                updateShopUI();
            }

            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = true; 
        });

        window.addEventListener('keyup', e => { 
            if (e.code === "Space") keys.space = false;
            if (e.key === "Shift" || e.code === "ShiftLeft") keys.shift = false;
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false; 
        });

        let playerVelocityY = 0;
        const gravity = -0.018;
        const jumpStrength = 0.4;
        let isGrounded = true;

        let camYaw = 0;
        let camPitch = 0.3;
        let camDistance = 8.0;
        let isRightMouseDown = false;

        window.addEventListener('mousedown', (e) => {
            if (e.button === 2) isRightMouseDown = true;
        });
        window.addEventListener('mouseup', () => isRightMouseDown = false);
        window.addEventListener('contextmenu', e => e.preventDefault());

        window.addEventListener('mousemove', e => {
            if (isRightMouseDown) {
                camYaw -= e.movementX * 0.005;
                camPitch += e.movementY * 0.005;
                camPitch = Math.max(-0.2, Math.min(Math.PI / 2 - 0.1, camPitch));
            }
        });

        window.addEventListener('wheel', e => {
            camDistance += e.deltaY * 0.005;
            camDistance = Math.max(0, Math.min(30, camDistance));
        });

        let currentRotation = 0;
        let walkTimer = 0;

        // --- 9. GAME LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            grassMaterial.uniforms.time.value = elapsedTime;
            grassMaterial.uniforms.playerPos.value.copy(playerGroup.position);

            const floorY = getTerrainHeightAt(playerGroup.position.x, playerGroup.position.z);
            mineRadiusRing.position.x = playerGroup.position.x;
            mineRadiusRing.position.z = playerGroup.position.z;
            mineRadiusRing.position.y = floorY + 0.05;

            // Dynamic depth metric updating
            const depthMeters = Math.abs(Math.min(0, playerGroup.position.y)).toFixed(1);
            let layerName = "Grass Layer";
            if (playerGroup.position.y < -60) layerName = "Core Abyss Layer";
            else if (playerGroup.position.y < -35) layerName = "Galaxy Void Layer";
            else if (playerGroup.position.y < -15) layerName = "Magma Layer";
            else if (playerGroup.position.y < -5) layerName = "Deepslate Layer";
            else if (playerGroup.position.y < -1) layerName = "Stone Layer";
            
            document.getElementById('layer-info').innerText = `Current Depth: -${depthMeters}m (${layerName})`;

            if (keys.i) camDistance = Math.max(0, camDistance - 0.2);
            if (keys.o) camDistance = Math.min(30, camDistance + 0.2);

            // JUMPING & GRAVITY DYNAMIC COLLISION WITH MINED TERRAIN
            if (keys.space && isGrounded) {
                playerVelocityY = jumpStrength;
                isGrounded = false;
            }

            playerGroup.position.y += playerVelocityY;
            if (!isGrounded) {
                playerVelocityY += gravity;
            }

            // Dynamic floor collision (allows falling into mined shafts)
            if (playerGroup.position.y <= floorY) {
                playerGroup.position.y = floorY;
                playerVelocityY = 0;
                isGrounded = true;
            } else {
                isGrounded = false;
            }

            // MOVEMENT & ANIMATION
            const currentSpeed = keys.shift ? 0.28 : 0.15;
            const animFrequency = keys.shift ? 0.32 : 0.20;

            let inputX = 0;
            let inputZ = 0;

            if (keys.w) inputZ -= 1;
            if (keys.s) inputZ += 1;
            if (keys.a) inputX -= 1;
            if (keys.d) inputX += 1;

            const isMoving = inputX !== 0 || inputZ !== 0;

            if (isMoving) {
                const targetAngle = Math.atan2(inputX, inputZ) + camYaw;

                playerGroup.position.x += Math.sin(targetAngle) * currentSpeed;
                playerGroup.position.z += Math.cos(targetAngle) * currentSpeed;

                let diff = targetAngle - currentRotation;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                currentRotation += diff * 0.15;

                playerGroup.rotation.y = currentRotation;

                walkTimer += animFrequency;
                const swing = Math.sin(walkTimer) * 0.6;
                leftArm.rotation.x = swing;
                
                if (isToolEquipped) {
                    rightArm.rotation.x = -Math.PI / 4 + (swing * 0.3);
                } else {
                    rightArm.rotation.x = -swing;
                }
                leftLeg.rotation.x = -swing;
                rightLeg.rotation.x = swing;
            } else {
                leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, 0, 0.15);
                
                if (isToolEquipped) {
                    rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, -Math.PI / 4, 0.15);
                } else {
                    rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, 0, 0.15);
                }
                leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, 0, 0.15);
                rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, 0, 0.15);
            }

            // Mining Swing Animation
            if (swingAnimTimer > 0) {
                swingAnimTimer -= 0.12 * toolsData[currentToolIndex].speed;
                rightArm.rotation.x = -Math.PI / 1.5;
            }

            headGroup.visible = camDistance > 0.8;

            const targetPos = playerGroup.position.clone().add(new THREE.Vector3(0, 2.4, 0));

            const camX = targetPos.x + camDistance * Math.sin(camYaw) * Math.cos(camPitch);
            const camY = targetPos.y + camDistance * Math.sin(camPitch);
            const camZ = targetPos.z + camDistance * Math.cos(camYaw) * Math.cos(camPitch);

            camera.position.set(camX, camY, camZ);
            camera.lookAt(targetPos);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
