<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Roblox Mechanics + Dense Interactive Grass</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; user-select: none; }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="instructions">
        WASD to Move | A = Left, D = Right<br>
        Press 'I' to Zoom In | Press 'O' to Zoom Out<br>
        Right-Click + Drag to Orbit Camera
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- 2. LIGHTS ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 0.9);
        dirLight.position.set(30, 50, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 3. DENSE & SHORTER INTERACTIVE GRASS ---
        // Shorter grass height (0.6 instead of 1.4)
        const grassGeometry = new THREE.PlaneGeometry(0.1, 0.6, 1, 4);
        grassGeometry.translate(0, 0.3, 0); 

        const grassMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                attribute float phase;
                uniform float time;
                uniform vec3 playerPos;
                varying float vHeight;

                void main() {
                    vHeight = position.y / 0.6;
                    vec3 worldPos = (instanceMatrix * vec4(position, 1.0)).xyz;
                    vec3 pos = position;

                    // Light wind sway
                    float wave = sin(time * 3.0 + phase) * 0.08 * pow(vHeight, 2.0);
                    pos.x += wave;

                    // Player Trample & Push Outwards Physics
                    float dist = distance(worldPos.xz, playerPos.xz);
                    float pushRadius = 1.2;

                    if (dist < pushRadius) {
                        float pushFactor = (1.0 - (dist / pushRadius)) * pow(vHeight, 1.2);
                        vec2 pushDir = normalize(worldPos.xz - playerPos.xz + vec2(0.001)); // Prevent division by zero
                        
                        // Push grass outwards away from feet
                        pos.x += pushDir.x * pushFactor * 0.8;
                        pos.z += pushDir.y * pushFactor * 0.8;
                        
                        // Bend down / flatten shorter grass underfoot
                        pos.y -= pushFactor * 0.45;
                    }

                    vec4 mvPosition = modelViewMatrix * instanceMatrix * vec4(pos, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying float vHeight;
                void main() {
                    vec3 baseColor = vec3(0.08, 0.35, 0.05);
                    vec3 tipColor = vec3(0.45, 0.8, 0.15);
                    vec3 finalColor = mix(baseColor, tipColor, vHeight);
                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `,
            uniforms: { 
                time: { value: 0 },
                playerPos: { value: new THREE.Vector3() }
            },
            side: THREE.DoubleSide
        });

        // Double the grass count (30,000 blades)
        const grassCount = 30000;
        const grassField = new THREE.InstancedMesh(grassGeometry, grassMaterial, grassCount);
        const dummy = new THREE.Object3D();
        const phases = new Float32Array(grassCount);

        for (let i = 0; i < grassCount; i++) {
            dummy.position.set(
                (Math.random() - 0.5) * 80,
                0,
                (Math.random() - 0.5) * 80
            );
            dummy.rotation.y = Math.random() * Math.PI * 2;
            const scale = 0.8 + Math.random() * 0.4;
            dummy.scale.set(scale, scale, scale);
            dummy.updateMatrix();
            grassField.setMatrixAt(i, dummy.matrix);
            phases[i] = Math.random() * Math.PI * 2;
        }
        grassGeometry.setAttribute('phase', new THREE.InstancedBufferAttribute(phases, 1));
        scene.add(grassField);

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshLambertMaterial({ color: 0x1e4112 })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // --- 4. PLAYER MODEL ---
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        const skinMat = new THREE.MeshLambertMaterial({ color: 0xffcc99 });
        const shirtMat = new THREE.MeshLambertMaterial({ color: 0x0066cc });
        const pantsMat = new THREE.MeshLambertMaterial({ color: 0x222222 });

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), skinMat);
        head.position.y = 2.4;
        playerGroup.add(head);

        const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.6), shirtMat);
        torso.position.y = 1.3;
        playerGroup.add(torso);

        const createLimb = (geo, mat, pos) => {
            geo.translate(0, -0.5, 0);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            playerGroup.add(mesh);
            return mesh;
        };

        const leftArm = createLimb(new THREE.BoxGeometry(0.4, 1.2, 0.4), skinMat, new THREE.Vector3(-0.8, 1.9, 0));
        const rightArm = createLimb(new THREE.BoxGeometry(0.4, 1.2, 0.4), skinMat, new THREE.Vector3(0.8, 1.9, 0));
        const leftLeg = createLimb(new THREE.BoxGeometry(0.5, 1.2, 0.5), pantsMat, new THREE.Vector3(-0.35, 0.6, 0));
        const rightLeg = createLimb(new THREE.BoxGeometry(0.5, 1.2, 0.5), pantsMat, new THREE.Vector3(0.35, 0.6, 0));

        // --- 5. CONTROLS, FIXED DIRECTIONS & CAMERA ---
        const keys = { w: false, a: false, s: false, d: false, i: false, o: false };
        window.addEventListener('keydown', e => { 
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = true; 
        });
        window.addEventListener('keyup', e => { 
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false; 
        });

        let camYaw = 0;
        let camPitch = 0.3;
        let camDistance = 8.0;
        let isRightMouseDown = false;

        window.addEventListener('mousedown', e => { if (e.button === 0 || e.button === 2) isRightMouseDown = true; });
        window.addEventListener('mouseup', () => isRightMouseDown = false);
        window.addEventListener('contextmenu', e => e.preventDefault());

        window.addEventListener('mousemove', e => {
            if (isRightMouseDown) {
                camYaw -= e.movementX * 0.005;
                camPitch += e.movementY * 0.005;
                camPitch = Math.max(-0.2, Math.min(Math.PI / 2 - 0.1, camPitch));
            }
        });

        window.addEventListener('wheel', e => {
            camDistance += e.deltaY * 0.005;
            camDistance = Math.max(0, Math.min(25, camDistance));
        });

        let walkTimer = 0;
        const speed = 0.12;

        // --- 6. GAME LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            grassMaterial.uniforms.time.value = elapsedTime;
            grassMaterial.uniforms.playerPos.value.copy(playerGroup.position);

            // Zoom In / Zoom Out Controls
            if (keys.i) camDistance = Math.max(0, camDistance - 0.2);
            if (keys.o) camDistance = Math.min(25, camDistance + 0.2);

            let moveX = 0;
            let moveZ = 0;

            if (keys.w) moveZ -= 1;
            if (keys.s) moveZ += 1;
            if (keys.a) moveX -= 1; // Fixed: A goes Left
            if (keys.d) moveX += 1; // Fixed: D goes Right

            const isMoving = moveX !== 0 || moveZ !== 0;

            if (isMoving) {
                // Correct direction relative to camera
                const moveAngle = Math.atan2(moveX, moveZ) + camYaw;

                playerGroup.position.x += Math.sin(moveAngle) * speed;
                playerGroup.position.z += Math.cos(moveAngle) * speed;

                // Smooth player rotation
                const targetRotation = new THREE.Quaternion();
                targetRotation.setFromAxisAngle(new THREE.Vector3(0, 1, 0), moveAngle);
                playerGroup.quaternion.slerp(targetRotation, 0.15);

                // Smooth camera follow (prevents rapid shaking)
                let angleDiff = moveAngle - camYaw;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                camYaw += angleDiff * 0.02; 

                // Limb animation
                walkTimer += 0.18;
                const swing = Math.sin(walkTimer) * 0.6;
                leftArm.rotation.x = swing;
                rightArm.rotation.x = -swing;
                leftLeg.rotation.x = -swing;
                rightLeg.rotation.x = swing;
            } else {
                // Idle limb reset
                leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, 0, 0.1);
                rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, 0, 0.1);
                leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, 0, 0.1);
                rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, 0, 0.1);
            }

            // Hide head in First Person
            head.visible = camDistance > 0.8;

            // Update Smooth Camera Position
            const targetPos = playerGroup.position.clone().add(new THREE.Vector3(0, 2.4, 0));

            const camX = targetPos.x + camDistance * Math.sin(camYaw) * Math.cos(camPitch);
            const camY = targetPos.y + camDistance * Math.sin(camPitch);
            const camZ = targetPos.z + camDistance * Math.cos(camYaw) * Math.cos(camPitch);

            camera.position.set(camX, camY, camZ);
            camera.lookAt(targetPos);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
