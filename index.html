<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blocky Roblox Mountain Mining Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .hud-box {
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #money-display { color: #55ff55; font-size: 20px; }
        #layer-info { color: #00ffcc; font-size: 14px; }
        #inventory-info { color: #ffcc00; font-size: 14px; }

        #sell-btn {
            pointer-events: auto;
            background: #ff9900;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(255, 153, 0, 0.4);
        }
        #sell-btn:hover { background: #ffaa22; transform: scale(1.05); }

        #shop-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            max-height: 85vh;
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            overflow-y: auto;
        }
        
        #shop-title {
            font-size: 20px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffcc00;
        }

        .shop-item {
            background: rgba(255, 255, 255, 0.08);
            margin-bottom: 8px;
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .shop-item:hover { background: rgba(255, 255, 255, 0.15); }
        .item-info { display: flex; flex-direction: column; }
        .item-name { font-weight: bold; font-size: 14px; color: #fff; }
        .item-stats { font-size: 11px; color: #00ffcc; font-weight: bold; margin-top: 2px; }
        .item-cost { font-size: 12px; color: #55ff55; font-weight: 800; margin-top: 2px; }

        .shop-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .shop-btn:hover { background: #34ce57; transform: scale(1.05); }
        .shop-btn.disabled { background: #555; cursor: not-allowed; opacity: 0.6; }
        .shop-btn.active { background: #007bff; cursor: default; }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #ddd;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-box" id="money-display">💰 Cash: $0</div>
        <div class="hud-box" id="inventory-info">🎒 Blocks Mined: 0</div>
        <div class="hud-box" id="layer-info">⛰️ Depth: 0m (Grass Mountain)</div>
        <button id="sell-btn" onclick="sellBlocks()">💰 Sell All Blocks</button>
    </div>

    <div id="shop-container">
        <div id="shop-title">🛠️ Tool Shop</div>
        <div id="shop-list"></div>
    </div>

    <div id="instructions">
        WASD: Move | SHIFT: Sprint | SPACE: Jump | E: Toggle Tool | CLICK Ground: Mine Blocky Terrain
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. GAME DATA & PLAYER ECONOMY ---
        let playerMoney = 0;
        let minedInventory = { grass: 0, stone: 0, deepslate: 0, magma: 0, void: 0 };
        let totalBlocksMined = 0;

        const blockValues = {
            grass: 1,
            stone: 5,
            deepslate: 25,
            magma: 120,
            void: 600
        };

        const toolsData = [
            { id: 1, name: "Rusty Pick", cost: 0, power: 1, speed: 1.0, radius: 1, color: 0x8b4513, geo: "pick" },
            { id: 2, name: "Iron Dagger", cost: 150, power: 2, speed: 1.4, radius: 1, color: 0xaaaaaa, geo: "chisel" },
            { id: 3, name: "Steel Drill", cost: 1200, power: 4, speed: 1.8, radius: 2, color: 0x4682b4, geo: "drill" },
            { id: 4, name: "Gold Hammer", cost: 8500, power: 8, speed: 2.3, radius: 2, color: 0xffd700, geo: "pick" },
            { id: 5, name: "Diamond Excavator", cost: 45000, power: 15, speed: 3.0, radius: 3, color: 0x00ffff, geo: "drill" },
            { id: 6, name: "Magma Buster", cost: 250000, power: 30, speed: 4.0, radius: 3, color: 0xff4500, geo: "chisel" },
            { id: 7, name: "Plasma Cutter", cost: 1500000, power: 60, speed: 5.2, radius: 4, color: 0x9400d3, geo: "drill" },
            { id: 8, name: "Void Smasher", cost: 8000000, power: 120, speed: 6.5, radius: 4, color: 0x111111, geo: "pick" },
            { id: 9, name: "Quantum Annihilator", cost: 25000000, power: 250, speed: 8.0, radius: 5, color: 0x00ff66, geo: "drill" },
            { id: 10, name: "Galaxy Drill", cost: 50000000, power: 500, speed: 10.0, radius: 6, color: 0xff00ff, geo: "galaxy" }
        ];

        let ownedTools = [true, false, false, false, false, false, false, false, false, false];
        let currentToolIndex = 0;
        let isToolEquipped = true;
        let lastMineTime = 0;

        // --- 2. THREE.JS SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7ec0ee);
        scene.fog = new THREE.FogExp2(0x7ec0ee, 0.008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(40, 80, 40);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 3. VOXEL BLOCK MOUNTAIN TERRAIN ---
        const GRID_SIZE = 50;
        const BLOCK_SIZE = 1.5;
        const terrainMap = new Map();

        const blockMaterials = {
            grass: new THREE.MeshLambertMaterial({ color: 0x44aa44 }),
            stone: new THREE.MeshLambertMaterial({ color: 0x777777 }),
            deepslate: new THREE.MeshLambertMaterial({ color: 0x333339 }),
            magma: new THREE.MeshLambertMaterial({ color: 0xd34800 }),
            void: new THREE.MeshLambertMaterial({ color: 0x4b0082 })
        };

        const boxGeo = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
        const terrainGroup = new THREE.Group();
        scene.add(terrainGroup);

        function getBlockType(y) {
            if (y >= 0) return 'grass';
            if (y >= -6 * BLOCK_SIZE) return 'stone';
            if (y >= -14 * BLOCK_SIZE) return 'deepslate';
            if (y >= -24 * BLOCK_SIZE) return 'magma';
            return 'void';
        }

        // Generate Blocky Mountain
        for (let x = -GRID_SIZE / 2; x < GRID_SIZE / 2; x++) {
            for (let z = -GRID_SIZE / 2; z < GRID_SIZE / 2; z++) {
                const distFromCenter = Math.sqrt(x * x + z * z);
                const mountainHeight = Math.max(0, Math.floor((20 - distFromCenter * 0.8)));

                for (let y = mountainHeight; y >= -30; y--) {
                    const blockType = getBlockType(y * BLOCK_SIZE);
                    const mesh = new THREE.Mesh(boxGeo, blockMaterials[blockType]);
                    mesh.position.set(x * BLOCK_SIZE, y * BLOCK_SIZE, z * BLOCK_SIZE);
                    mesh.userData = { gridX: x, gridY: y, gridZ: z, type: blockType, hp: getBlockHp(blockType) };
                    
                    terrainGroup.add(mesh);
                    terrainMap.set(`${x},${y},${z}`, mesh);
                }
            }
        }

        function getBlockHp(type) {
            switch(type) {
                case 'grass': return 1;
                case 'stone': return 3;
                case 'deepslate': return 8;
                case 'magma': return 20;
                case 'void': return 50;
                default: return 1;
            }
        }

        // --- 4. ROBLOX PLAYER CHARACTER ---
        const playerGroup = new THREE.Group();
        playerGroup.position.set(0, 35, 0);
        scene.add(playerGroup);

        const skinMat = new THREE.MeshLambertMaterial({ color: 0xffcc99 });
        const shirtMat = new THREE.MeshLambertMaterial({ color: 0x0066cc });
        const pantsMat = new THREE.MeshLambertMaterial({ color: 0x222222 });

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), skinMat);
        head.position.y = 2.0; playerGroup.add(head);

        const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.6), shirtMat);
        torso.position.y = 1.0; playerGroup.add(torso);

        const createLimb = (mat, pos) => {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.5), mat);
            mesh.geometry.translate(0, -0.5, 0);
            mesh.position.copy(pos);
            playerGroup.add(mesh);
            return mesh;
        };

        const leftArm = createLimb(skinMat, new THREE.Vector3(-0.85, 1.6, 0));
        const rightArm = createLimb(skinMat, new THREE.Vector3(0.85, 1.6, 0));
        const leftLeg = createLimb(pantsMat, new THREE.Vector3(-0.35, 0.4, 0));
        const rightLeg = createLimb(pantsMat, new THREE.Vector3(0.35, 0.4, 0));

        const toolContainer = new THREE.Group();
        toolContainer.position.set(0, -0.8, 0.2);
        rightArm.add(toolContainer);

        // --- 5. SHOP & ECONOMY SYSTEM ---
        function sellBlocks() {
            let earnings = 0;
            for (let type in minedInventory) {
                earnings += minedInventory[type] * blockValues[type];
                minedInventory[type] = 0;
            }
            playerMoney += earnings;
            totalBlocksMined = 0;
            updateHUD();
            updateShopUI();
        }

        function buildToolMesh(data) {
            const group = new THREE.Group();
            const headMat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.2, metalness: 0.8 });
            const handleMat = new THREE.MeshLambertMaterial({ color: 0x3d2314 });

            const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.2), handleMat);
            handle.rotation.x = Math.PI / 3;
            group.add(handle);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 0.2), headMat);
            head.position.set(0, 0.4, 0.4);
            group.add(head);
            return group;
        }

        function equipTool(index) {
            if (!ownedTools[index]) return;
            currentToolIndex = index;
            isToolEquipped = true;
            toolContainer.visible = true;
            while(toolContainer.children.length > 0) toolContainer.remove(toolContainer.children[0]);
            toolContainer.add(buildToolMesh(toolsData[index]));
            updateShopUI();
        }

        function buyTool(index) {
            const tool = toolsData[index];
            if (playerMoney >= tool.cost && !ownedTools[index]) {
                playerMoney -= tool.cost;
                ownedTools[index] = true;
                equipTool(index);
                updateHUD();
                updateShopUI();
            }
        }

        const shopListEl = document.getElementById('shop-list');
        function renderShopItems() {
            shopListEl.innerHTML = '';
            toolsData.forEach((tool, idx) => {
                const item = document.createElement('div');
                item.className = 'shop-item';
                item.innerHTML = `
                    <div class="item-info">
                        <span class="item-name">Lvl ${tool.id}: ${tool.name}</span>
                        <span class="item-stats">⚡ PWR: ${tool.power} | 💨 RAD: ${tool.radius}</span>
                        <span class="item-cost">$${tool.cost.toLocaleString()}</span>
                    </div>
                    <button class="shop-btn" id="btn-tool-${idx}"></button>
                `;
                shopListEl.appendChild(item);
            });
        }
        renderShopItems();

        function updateShopUI() {
            toolsData.forEach((tool, idx) => {
                const btn = document.getElementById(`btn-tool-${idx}`);
                if (ownedTools[idx]) {
                    if (idx === currentToolIndex && isToolEquipped) {
                        btn.innerText = "Equipped";
                        btn.className = "shop-btn active";
                        btn.onclick = null;
                    } else {
                        btn.innerText = "Equip";
                        btn.className = "shop-btn";
                        btn.onclick = () => equipTool(idx);
                    }
                } else {
                    btn.innerText = "Buy";
                    if (playerMoney >= tool.cost) {
                        btn.className = "shop-btn";
                        btn.onclick = () => buyTool(idx);
                    } else {
                        btn.className = "shop-btn disabled";
                        btn.onclick = null;
                    }
                }
            });
        }

        function updateHUD() {
            document.getElementById('money-display').innerText = `💰 Cash: $${playerMoney.toLocaleString()}`;
            document.getElementById('inventory-info').innerText = `🎒 Mined: ${totalBlocksMined} Blocks`;
            
            const depth = Math.max(0, Math.floor((30 - playerGroup.position.y))).toFixed(0);
            let layerName = "Grass Mountain";
            if (playerGroup.position.y < -24 * BLOCK_SIZE) layerName = "Galaxy Void Layer";
            else if (playerGroup.position.y < -14 * BLOCK_SIZE) layerName = "Magma Layer";
            else if (playerGroup.position.y < -6 * BLOCK_SIZE) layerName = "Deepslate Layer";
            else if (playerGroup.position.y < 0) layerName = "Stone Layer";
            
            document.getElementById('layer-info').innerText = `⛰️ Depth: ${depth}m (${layerName})`;
        }

        equipTool(0);

        // --- 6. FAST BLOCKY MINING ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (e) => {
            if (e.target.closest('#shop-container') || e.target.closest('#sell-btn')) return;
            if (!isToolEquipped) return;

            const tool = toolsData[currentToolIndex];
            const now = performance.now();
            if (now - lastMineTime < 400 / tool.speed) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(terrainGroup.children);

            if (intersects.length > 0) {
                const targetBlock = intersects[0].object;
                if (playerGroup.position.distanceTo(targetBlock.position) <= 12) {
                    lastMineTime = now;
                    mineVoxelRadius(targetBlock.userData.gridX, targetBlock.userData.gridY, targetBlock.userData.gridZ, tool.power, tool.radius);
                }
            }
        });

        function mineVoxelRadius(cx, cy, cz, power, radius) {
            for (let x = -radius; x <= radius; x++) {
                for (let y = -radius; y <= radius; y++) {
                    for (let z = -radius; z <= radius; z++) {
                        if (Math.sqrt(x*x + y*y + z*z) <= radius) {
                            const key = `${cx + x},${cy + y},${cz + z}`;
                            const block = terrainMap.get(key);
                            if (block) {
                                block.userData.hp -= power;
                                if (block.userData.hp <= 0) {
                                    minedInventory[block.userData.type]++;
                                    totalBlocksMined++;
                                    terrainGroup.remove(block);
                                    terrainMap.delete(key);
                                }
                            }
                        }
                    }
                }
            }
            updateHUD();
            updateShopUI();
        }

        // --- 7. PLAYER CONTROLS & CAMERA ---
        const keys = { w: false, a: false, s: false, d: false, space: false, shift: false };
        window.addEventListener('keydown', e => {
            if (e.code === "Space") keys.space = true;
            if (e.key === "Shift" || e.code === "ShiftLeft") keys.shift = true;
            if (e.key.toLowerCase() === 'e') {
                isToolEquipped = !isToolEquipped;
                toolContainer.visible = isToolEquipped;
                updateShopUI();
            }
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = true;
        });

        window.addEventListener('keyup', e => {
            if (e.code === "Space") keys.space = false;
            if (e.key === "Shift" || e.code === "ShiftLeft") keys.shift = false;
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false;
        });

        let camYaw = 0, camPitch = 0.3, camDistance = 10.0;
        let isRightMouseDown = false;

        window.addEventListener('mousedown', e => { if (e.button === 2) isRightMouseDown = true; });
        window.addEventListener('mouseup', () => isRightMouseDown = false);
        window.addEventListener('contextmenu', e => e.preventDefault());
        window.addEventListener('mousemove', e => {
            if (isRightMouseDown) {
                camYaw -= e.movementX * 0.005;
                camPitch += e.movementY * 0.005;
                camPitch = Math.max(-0.2, Math.min(Math.PI / 2 - 0.1, camPitch));
            }
        });

        let playerVelocityY = 0;
        let isGrounded = false;

        // --- 8. MAIN GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Gravity & Simple Surface Raycast Collision
            playerVelocityY -= 0.015;
            playerGroup.position.y += playerVelocityY;

            // Simple floor collision check
            const pGx = Math.round(playerGroup.position.x / BLOCK_SIZE);
            const pGy = Math.round((playerGroup.position.y - 0.5) / BLOCK_SIZE);
            const pGz = Math.round(playerGroup.position.z / BLOCK_SIZE);
            
            if (terrainMap.has(`${pGx},${pGy},${pGz}`)) {
                playerGroup.position.y = (pGy + 1) * BLOCK_SIZE;
                playerVelocityY = 0;
                isGrounded = true;
            } else {
                isGrounded = false;
            }

            if (keys.space && isGrounded) {
                playerVelocityY = 0.35;
                isGrounded = false;
            }

            const currentSpeed = keys.shift ? 0.3 : 0.15;
            let inputX = 0, inputZ = 0;
            if (keys.w) inputZ -= 1;
            if (keys.s) inputZ += 1;
            if (keys.a) inputX -= 1;
            if (keys.d) inputX += 1;

            if (inputX !== 0 || inputZ !== 0) {
                const targetAngle = Math.atan2(inputX, inputZ) + camYaw;
                playerGroup.position.x += Math.sin(targetAngle) * currentSpeed;
                playerGroup.position.z += Math.cos(targetAngle) * currentSpeed;
                playerGroup.rotation.y = targetAngle;
            }

            // Camera Tracking
            const targetPos = playerGroup.position.clone().add(new THREE.Vector3(0, 2, 0));
            camera.position.set(
                targetPos.x + camDistance * Math.sin(camYaw) * Math.cos(camPitch),
                targetPos.y + camDistance * Math.sin(camPitch),
                targetPos.z + camDistance * Math.cos(camYaw) * Math.cos(camPitch)
            );
            camera.lookAt(targetPos);

            updateHUD();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
