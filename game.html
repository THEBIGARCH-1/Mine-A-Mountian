<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wobbly Life Style Prototype</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
        }
        canvas {
            background-color: #7ecef4;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .instructions {
            position: absolute;
            top: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="instructions">
        <h2>Wobbly Character Prototype</h2>
        <p>Use <b>W, A, S, D</b> to move around!</p>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Character object with wobbly physics properties
        let player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 25,
            speed: 4,
            vx: 0,
            vy: 0,
            wobbleOffset: 0
        };

        // Track pressed keys
        let keys = {};

        window.addEventListener("keydown", (e) => {
            keys[e.key.toLowerCase()] = true;
        });

        window.addEventListener("keyup", (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        function update() {
            // Target velocity based on WASD input
            let targetVx = 0;
            let targetVy = 0;

            if (keys['w']) targetVy -= player.speed;
            if (keys['s']) targetVy += player.speed;
            if (keys['a']) targetVx -= player.speed;
            if (keys['d']) targetVx += player.speed;

            // Smooth momentum (physics lag for wobbly feel)
            player.vx += (targetVx - player.vx) * 0.1;
            player.vy += (targetVy - player.vy) * 0.1;

            // Update position
            player.x += player.vx;
            player.y += player.vy;

            // Screen boundaries
            if (player.x < player.radius) player.x = player.radius;
            if (player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;
            if (player.y < player.radius) player.y = player.radius;
            if (player.y > canvas.height - player.radius) player.y = canvas.height - player.radius;

            // Calculate wobbly stretch when moving
            let currentSpeed = Math.abs(player.vx) + Math.abs(player.vy);
            if (currentSpeed > 0.5) {
                player.wobbleOffset = Math.sin(Date.now() / 80) * 6;
            } else {
                player.wobbleOffset = Math.sin(Date.now() / 300) * 2; // Idle sway
            }
        }

        function draw() {
            // Clear screen (Sky color)
            ctx.fillStyle = "#7ecef4";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw ground grid / details
            ctx.fillStyle = "#5cba47";
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);

            // Draw Wobbly Character (Squish and stretch based on movement)
            ctx.save();
            ctx.translate(player.x, player.y);

            let stretchX = player.radius + player.wobbleOffset;
            let stretchY = player.radius - player.wobbleOffset;

            ctx.fillStyle = "#ffcc00"; // Goofy yellow character color
            ctx.beginPath();
            ctx.ellipse(0, 0, stretchX, stretchY, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#333";
            ctx.stroke();

            // Draw eyes
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(-8, -5, 6, 0, Math.PI * 2);
            ctx.arc(8, -5, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "black";
            ctx.beginPath();
            ctx.arc(-8, -5, 2, 0, Math.PI * 2);
            ctx.arc(8, -5, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
